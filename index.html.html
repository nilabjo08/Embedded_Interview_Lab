y just the CPU. RAM, storage and\nperipherals are external. Usually runs an OS like Linux. Examples: Intel\nx86, ARM Cortex-A.<\/li>\n<\/ul>\n", "hook": "MCU = computer on a chip, MPU = brain only.", "hot": false, "lab": ""}, {"id": "E2", "title": "Harvard vs Von Neumann architecture?", "html": "<ul>\n<li><strong>Von Neumann:<\/strong> one memory and one bus for both code\nand data. Simple, but fetching an instruction and data cannot happen at\nthe same time.<\/li>\n<li><strong>Harvard:<\/strong> separate memories and buses for code and\ndata. Both can be accessed in parallel, which is faster. AVR is Harvard.\nCortex-M is a “modified Harvard” (separate buses, one address\nspace).<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E3", "title": "RISC vs CISC?", "html": "<ul>\n<li><strong>RISC:<\/strong> few, simple, fixed-length instructions, most\nexecute in one cycle, many registers (ARM, RISC-V, AVR).<\/li>\n<li><strong>CISC:<\/strong> many complex, variable-length instructions\nthat can do more per instruction (x86, 8051).<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E4", "title": "What are the types of memory in an embedded system?", "html": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Memory<\/th>\n<th>Volatile?<\/th>\n<th>Use<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>SRAM<\/td>\n<td>Yes<\/td>\n<td>Stack, heap, variables<\/td>\n<td>Fast, no refresh needed<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DRAM<\/td>\n<td>Yes<\/td>\n<td>External big RAM<\/td>\n<td>Needs periodic refresh<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Flash<\/td>\n<td>No<\/td>\n<td>Program code, constants<\/td>\n<td>Erased in sectors, limited write cycles<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EEPROM<\/td>\n<td>No<\/td>\n<td>Small settings and calibration data<\/td>\n<td>Byte-erasable, slow<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ROM / OTP<\/td>\n<td>No<\/td>\n<td>Fixed bootcode<\/td>\n<td>Cannot be changed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Important Flash rule:<\/strong> writing can only change a bit\nfrom 1 to 0. To get a 1 back you must <strong>erase a whole page or\nsector<\/strong> (which sets everything to 1). Flash also wears out\n(roughly 10,000 to 100,000 erase cycles), so do not write a counter to\nthe same location every second.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "E5", "title": "What are the key facts about ARM Cortex-M you should know?", "html": "<ul>\n<li><strong>Registers:<\/strong> R0 to R12 (general), R13 = SP (stack\npointer), R14 = LR (link register), R15 = PC, plus xPSR (status).<\/li>\n<li><strong>Two stack pointers:<\/strong> MSP (main, used by handlers and\nstartup) and PSP (process, used by RTOS tasks).<\/li>\n<li><strong>Modes:<\/strong> Thread mode (normal code) and Handler mode\n(ISRs/exceptions). Privileged and unprivileged access levels.<\/li>\n<li><strong>Calling convention (AAPCS):<\/strong> arguments in R0 to R3,\nreturn value in R0, R4 to R11 are callee-saved.<\/li>\n<li><strong>Thumb instructions:<\/strong> 16/32-bit mixed. The lowest bit\nof a function address is 1 (Thumb state).<\/li>\n<li><strong>NVIC:<\/strong> the interrupt controller.\n<strong>SysTick:<\/strong> a built-in timer used for the RTOS tick.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E6", "title": "How does the NVIC prioritize interrupts?", "html": "<ul>\n<li><strong>Lower number = higher priority.<\/strong><\/li>\n<li>A higher-priority interrupt can preempt a running lower-priority one\n(nesting).<\/li>\n<li>Priority is split into <strong>preemption priority<\/strong> and\n<strong>sub-priority<\/strong> (sub-priority only decides which one runs\nfirst when two are pending, it does not allow preemption).<\/li>\n<li>Reset, NMI and HardFault have fixed top priorities.<\/li>\n<li><strong>Tail-chaining:<\/strong> if another interrupt is pending when\nan ISR finishes, the CPU jumps directly to it without unstacking and\nrestacking, which reduces latency.<\/li>\n<li><code>PRIMASK<\/code> disables all configurable interrupts.\n<code>BASEPRI<\/code> masks only those below a given priority.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E7", "title": "What causes a HardFault on Cortex-M and how do you debug it?", "html": "<p><strong>Common causes:<\/strong><\/p>\n<ul>\n<li>Dereferencing a null or invalid pointer<\/li>\n<li>Unaligned access (on cores that do not allow it)<\/li>\n<li>Stack overflow or corrupted stack<\/li>\n<li>Jumping to an invalid address or a bad function pointer<\/li>\n<li>Using a peripheral whose clock is not enabled<\/li>\n<li>Executing from non-executable memory<\/li>\n<li>Division by zero (if trapping is enabled)<\/li>\n<\/ul>\n<p><strong>How to debug:<\/strong><\/p>\n<ol type=\"1\">\n<li>In the HardFault handler, read the stacked registers (the stacked\n<strong>PC<\/strong> tells you the faulting instruction, and\n<strong>LR<\/strong> tells you who called it).<\/li>\n<li>Check the fault status registers: <code>CFSR<\/code>,\n<code>HFSR<\/code>, <code>BFAR<\/code> (bus fault address),\n<code>MMFAR<\/code>.<\/li>\n<li>Map the PC to a source line (debugger, or <code>addr2line<\/code>\nwith the ELF).<\/li>\n<\/ol>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E8", "title": "What is memory-mapped I/O? Why must you enable a peripheral clock?", "html": "<p><strong>Memory-mapped I/O:<\/strong> peripheral registers sit in the\nsame address space as memory, so you read and write them with normal\npointer operations (declared <code>volatile<\/code>). (Some architectures\nlike x86 also have port-mapped I/O with special IN/OUT\ninstructions.)<\/p>\n<p><strong>Peripheral clocks:<\/strong> to save power, most MCUs keep\nperipherals’ clocks off by default. If you write to a GPIO or UART\nregister without enabling its clock first (for example in the RCC\nregister on STM32), nothing happens, or you get a bus fault. This is the\nnumber one beginner bug: “my GPIO does not work”.<\/p>\n<pre class=\"c\"><code>RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOAEN;   // 1. enable clock\nGPIOA-&gt;MODER |= (1U &lt;&lt; 10);            // 2. then configure PA5 as output<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E9", "title": "What is the read-modify-write problem? What are write-1-to-clear flags?", "html": "<p><code>reg |= BIT(3);<\/code> is really three steps:\n<strong>read<\/strong> the register, <strong>modify<\/strong> the value,\n<strong>write<\/strong> it back. If an interrupt or the hardware changes\nthe register between the read and the write, that change is lost.<\/p>\n<p><strong>Fixes:<\/strong><\/p>\n<ul>\n<li>Use dedicated atomic set/clear registers (for example\n<code>GPIOx-&gt;BSRR<\/code> on STM32, or\n<code>SET<\/code>/<code>CLR<\/code> registers on other chips).<\/li>\n<li>Use bit-banding or atomic instructions where available.<\/li>\n<li>Disable interrupts around the operation.<\/li>\n<\/ul>\n<p><strong>Write-1-to-clear (W1C) flags:<\/strong> many status registers\nclear a flag when you write a 1 to it. Writing\n<code>STATUS |= FLAG_A;<\/code> reads the whole register (which may have\nother flags set) and writes those 1s back, which clears\n<strong>all<\/strong> the other flags by mistake. The correct way is\n<code>STATUS = FLAG_A;<\/code> (only that bit is 1).<\/p>\n", "hook": "", "hot": true, "lab": "bits"}, {"id": "E10", "title": "How do you write a safe critical section?", "html": "<pre class=\"c\"><code>uint32_t primask = __get_PRIMASK();   // save current state\n__disable_irq();\n/* access shared data */\n__set_PRIMASK(primask);               // restore, do not blindly enable<\/code><\/pre>\n<p><strong>Logic:<\/strong> restoring the previous state (instead of\nalways enabling) makes nested critical sections safe. Keep the section\nas short as possible, because interrupts are blocked, which increases\nlatency.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E11", "title": "Steps to configure a GPIO output. How do you choose an LED resistor?", "html": "<p><strong>Steps:<\/strong> (1) enable the peripheral clock, (2) set pin\nmode to output, (3) choose push-pull or open-drain, (4) set speed, (5)\nset pull-up/down if needed, (6) write the pin using the set/reset\nregister.<\/p>\n<p><strong>LED resistor:<\/strong> <code>R = (Vsupply - Vled) / I<\/code>.\nExample: (3.3 V - 2.0 V) / 10 mA = 130 ohm, so use the next standard\nvalue (150 ohm).<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E12", "title": "Explain timers and PWM. How do you calculate frequency and duty cycle?", "html": "<p>A timer is a counter driven by the clock. A\n<strong>prescaler<\/strong> slows the clock, and an <strong>auto-reload\n(ARR)<\/strong> value sets where the counter wraps.<\/p>\n<pre><code>Timer frequency = f_clk / ((PSC + 1) * (ARR + 1))\nPWM duty cycle  = CCR / (ARR + 1)<\/code><\/pre>\n<p><strong>Example:<\/strong> clock 16 MHz, want 1 kHz PWM with 25%\nduty.<\/p>\n<ul>\n<li>PSC = 15, so the counter clock is 16 MHz / 16 = 1 MHz.<\/li>\n<li>ARR = 999, so the period is 1000 counts = 1 ms = 1 kHz.<\/li>\n<li>CCR = 250 gives 25% duty.<\/li>\n<\/ul>\n<p><strong>Other modes:<\/strong> <em>input capture<\/em> (record the\ncounter on an external edge to measure pulse width or frequency),\n<em>output compare<\/em> (trigger an event or toggle a pin when the\ncounter matches a value).<\/p>\n<p><strong>Uses of PWM:<\/strong> LED brightness, motor speed, servo\nposition, simple DAC.<\/p>\n", "hook": "", "hot": true, "lab": "pwm"}, {"id": "E13", "title": "Explain ADC: resolution, reference voltage and conversion formula.", "html": "<p>An ADC turns an analog voltage into a digital number.<\/p>\n<pre><code>1 LSB = Vref / 2^N\nDigital value = (Vin / Vref) * (2^N - 1)<\/code><\/pre>\n<p><strong>Example:<\/strong> 12-bit ADC with Vref = 3.3 V. 1 LSB = 3.3 /\n4096, about 0.806 mV. A reading of 2048 is about 1.65 V.<\/p>\n<p><strong>Key points:<\/strong><\/p>\n<ul>\n<li><strong>Resolution:<\/strong> the number of bits. More bits means a\nfiner step.<\/li>\n<li><strong>Sampling rate:<\/strong> must be above twice the highest\nsignal frequency (Nyquist).<\/li>\n<li><strong>Sampling time:<\/strong> the input needs time to charge the\nsampling capacitor, so high-impedance sources need a longer sample\ntime.<\/li>\n<li><strong>Modes:<\/strong> single, continuous, scan (multiple\nchannels), triggered by a timer, and with DMA for streaming.<\/li>\n<li><strong>Noise reduction:<\/strong> averaging multiple samples, RC\nfilter at the input, stable reference.<\/li>\n<\/ul>\n", "hook": "", "hot": true, "lab": "adc"}, {"id": "E14", "title": "Explain UART in detail.", "html": "<p>UART is <strong>asynchronous<\/strong> (no clock line), so both sides\nmust be set to the same <strong>baud rate<\/strong>.<\/p>\n<p><strong>Frame:<\/strong> idle line is high. Start bit (low), then 8\ndata bits (LSB first), optional parity bit, then 1 or 2 stop bits\n(high).<\/p>\n<p><strong>Example:<\/strong> 9600 baud, 8N1 (8 data, no parity, 1 stop)\nuses 10 bits per byte, so about 960 bytes per second.<\/p>\n<p><strong>Errors:<\/strong> <em>framing error<\/em> (stop bit missing,\noften a baud mismatch), <em>parity error<\/em>, <em>overrun error<\/em> (a\nnew byte arrived before the old one was read). Fix overrun using\ninterrupts, DMA or a ring buffer.<\/p>\n<p><strong>Baud tolerance:<\/strong> the total baud error between the two\nsides should stay under about 2 to 3%.<\/p>\n<p><strong>Voltage levels:<\/strong> UART on an MCU is TTL (0 and 3.3 V\nor 5 V). RS-232 uses plus/minus 12 V and needs a level converter (like\nMAX232). RS-485 is differential for long distances.<\/p>\n", "hook": "", "hot": true, "lab": "uart"}, {"id": "E15", "title": "Explain SPI in detail.", "html": "<p>Four wires: <strong>MOSI<\/strong> (master out), <strong>MISO<\/strong>\n(master in), <strong>SCK<\/strong> (clock), <strong>CS/SS<\/strong> (chip\nselect, one per slave, active low). It is synchronous and full duplex:\nthe master and slave shift data out and in at the same time on every\nclock, like two shift registers connected in a ring.<\/p>\n<p><strong>Modes (0 to 3)<\/strong> are set by two bits:<\/p>\n<ul>\n<li><strong>CPOL:<\/strong> the idle level of the clock (0 = low, 1 =\nhigh).<\/li>\n<li><strong>CPHA:<\/strong> which clock edge samples data (0 = first\nedge, 1 = second edge).<\/li>\n<\/ul>\n<p>Master and slave must use the same mode.<\/p>\n<p><strong>Pros:<\/strong> very fast (tens of MHz), simple hardware, no\naddressing overhead. <strong>Cons:<\/strong> more wires, no\nacknowledgement, no built-in error check.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "E16", "title": "Explain I2C in detail.", "html": "<p>Two wires: <strong>SDA<\/strong> (data) and <strong>SCL<\/strong>\n(clock), both <strong>open-drain<\/strong> with <strong>pull-up\nresistors<\/strong>, so several devices can share the bus without\nconflict.<\/p>\n<ul>\n<li><strong>START:<\/strong> SDA falls while SCL is high.\n<strong>STOP:<\/strong> SDA rises while SCL is high.<\/li>\n<li>First byte after START: <strong>7-bit slave address + R/W\nbit<\/strong>.<\/li>\n<li>After every byte, the receiver pulls SDA low on the 9th clock for an\n<strong>ACK<\/strong> (leaving it high is a <strong>NACK<\/strong>).<\/li>\n<li><strong>Speeds:<\/strong> 100 kHz (standard), 400 kHz (fast), 1 MHz\n(fast plus).<\/li>\n<li><strong>Clock stretching:<\/strong> a slave can hold SCL low to ask\nthe master to wait.<\/li>\n<li><strong>Repeated START:<\/strong> change direction (write register\naddress, then read data) without releasing the bus.<\/li>\n<li><strong>Multi-master<\/strong> with arbitration.<\/li>\n<\/ul>\n<p><strong>Pull-up value tradeoff:<\/strong> too large means slow rising\nedges (signal distortion at high speed), too small means too much\ncurrent when pulled low. Typical value: 2.2 k to 10 k ohm.<\/p>\n<p><strong>Common bug:<\/strong> the bus stuck low after a reset in the\nmiddle of a transfer. Fix: toggle SCL up to 9 times to let the slave\nfinish, then send a STOP.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "E17", "title": "What is CAN?", "html": "<p>CAN (Controller Area Network) is a two-wire differential bus (CAN_H\nand CAN_L) used in cars and industry.<\/p>\n<ul>\n<li><strong>Message-based:<\/strong> each message has an\n<strong>ID<\/strong>, not a destination address. All nodes receive it and\nfilter by ID.<\/li>\n<li><strong>Priority by ID:<\/strong> the <strong>lower ID wins<\/strong>\narbitration without losing the message (non-destructive\narbitration).<\/li>\n<li>Classic CAN data: 0 to 8 bytes (CAN FD allows up to 64). Up to 1\nMbit/s (CAN FD is faster).<\/li>\n<li>Built-in <strong>CRC, ACK, error frames and bit stuffing<\/strong>,\nwhich makes it very robust.<\/li>\n<li><strong>120 ohm termination<\/strong> resistors at both ends of the\nbus.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E18", "title": "UART vs SPI vs I2C vs CAN: quick comparison", "html": "<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>UART<\/th>\n<th>SPI<\/th>\n<th>I2C<\/th>\n<th>CAN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Wires<\/td>\n<td>2 (TX, RX)<\/td>\n<td>4+ (MOSI, MISO, SCK, CS each)<\/td>\n<td>2 (SDA, SCL)<\/td>\n<td>2 (differential)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Clock<\/td>\n<td>Asynchronous<\/td>\n<td>Synchronous<\/td>\n<td>Synchronous<\/td>\n<td>Asynchronous (bit timing)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Speed<\/td>\n<td>Low to medium<\/td>\n<td>Highest<\/td>\n<td>Medium<\/td>\n<td>Medium (1 Mbps)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Devices<\/td>\n<td>Point-to-point<\/td>\n<td>1 master, many slaves<\/td>\n<td>Multi-master, multi-slave (addressed)<\/td>\n<td>Multi-master (ID based)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Duplex<\/td>\n<td>Full<\/td>\n<td>Full<\/td>\n<td>Half<\/td>\n<td>Half<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Distance<\/td>\n<td>Short (RS-485 long)<\/td>\n<td>Short (on board)<\/td>\n<td>Short (on board)<\/td>\n<td>Long (tens of meters to km)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Error check<\/td>\n<td>Parity<\/td>\n<td>None<\/td>\n<td>ACK<\/td>\n<td>CRC + ACK<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "hook": "UART = two devices talking; SPI = speed; I2C = fewer wires; CAN = robust, car networks.", "hot": true, "lab": ""}, {"id": "E19", "title": "How do you reduce power consumption in firmware?", "html": "<ul>\n<li>Use <strong>sleep modes<\/strong> (Sleep, Stop, Standby) and the\n<code>WFI<\/code> (wait for interrupt) or <code>WFE<\/code> instruction\nwhen idle.<\/li>\n<li>Be <strong>event-driven<\/strong>: wake up on interrupts instead of\npolling.<\/li>\n<li>Turn off unused peripherals and their clocks. Lower the clock\nfrequency or voltage when full speed is not needed.<\/li>\n<li>Configure unused pins correctly (analog or pull) to avoid floating\ninputs that draw current.<\/li>\n<li>Use DMA so the CPU can sleep while data moves.<\/li>\n<li>Trade-off: deeper sleep saves more power but wakes up slower and\nloses more state (RAM may be lost in the deepest mode).<\/li>\n<\/ul>\n", "hook": "", "hot": true, "lab": ""}, {"id": "E20", "title": "What is a bootloader? How does it jump to the application?", "html": "<p>A bootloader is a small program at the start of Flash. After reset it\nchecks whether to update the firmware (for example a button, a command\nover UART/CAN/USB, or a flag). If the application is valid (checked by a\nCRC or magic number), it jumps to it.<\/p>\n<p><strong>Jump steps (Cortex-M):<\/strong><\/p>\n<ol type=\"1\">\n<li>Read the application’s initial stack pointer (the first word of its\nvector table) and set MSP.<\/li>\n<li>Set <code>SCB-&gt;VTOR<\/code> to the application’s vector table\naddress.<\/li>\n<li>Disable interrupts and deinitialize peripherals used by the\nbootloader.<\/li>\n<li>Call the application’s Reset_Handler (the second word of the vector\ntable).<\/li>\n<\/ol>\n<p>The application must be <strong>linked at its own address<\/strong>\n(an offset after the bootloader) using its linker script. Safer designs\nuse two banks (A/B) so a failed update can roll back.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E21", "title": "How do you create non-blocking delays? What are hard and soft real-time?", "html": "<p>A blocking <code>delay_ms(1000)<\/code> freezes everything. Use a\nmillisecond tick (SysTick) and compare time instead:<\/p>\n<pre class=\"c\"><code>if ((now_ms - last_ms) &gt;= 1000U) {   // works even when the counter overflows\n    last_ms = now_ms;\n    toggle_led();\n}<\/code><\/pre>\n<p><strong>Why it works with overflow:<\/strong> unsigned subtraction\nwraps correctly, so the difference stays right.<\/p>\n<p><strong>Hard real-time:<\/strong> missing a deadline is a failure\n(airbag, ABS brake). <strong>Soft real-time:<\/strong> missing a deadline\nlowers quality but is not fatal (video streaming, UI). <strong>Real-time\nmeans predictable timing, not “fast”.<\/strong><\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E22", "title": "How do you wait for a hardware flag safely?", "html": "<p>Never loop forever on a hardware flag. Add a timeout so a hardware\nfault cannot hang the system.<\/p>\n<pre class=\"c\"><code>uint32_t timeout = 100000U;\nwhile (!(UART-&gt;SR &amp; TXE) &amp;&amp; --timeout) { }\nif (timeout == 0U) return ERR_TIMEOUT;<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E23", "title": "RTOS basics: task states, scheduling and context switch", "html": "<p><strong>Task states:<\/strong> Running (using the CPU), Ready (can\nrun, waiting for CPU), Blocked (waiting for time, queue, semaphore or\nevent), Suspended (stopped by request).<\/p>\n<p><strong>Scheduling:<\/strong><\/p>\n<ul>\n<li><strong>Preemptive priority-based:<\/strong> the highest-priority\nready task always runs. A higher one can interrupt a lower one\nimmediately.<\/li>\n<li><strong>Round-robin / time slicing:<\/strong> equal-priority tasks\ntake turns each tick.<\/li>\n<li><strong>Cooperative:<\/strong> tasks switch only when they\nyield.<\/li>\n<\/ul>\n<p><strong>Context switch:<\/strong> the RTOS saves the running task’s\nregisters on its own stack, picks the next task, and restores that\ntask’s registers. On Cortex-M this is done in the\n<strong>PendSV<\/strong> exception, and the periodic\n<strong>SysTick<\/strong> interrupt provides the tick.<\/p>\n<p><strong>Each task has:<\/strong> its own stack and a Task Control\nBlock (TCB) holding its state, priority and stack pointer.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "E24", "title": "What is a deadlock? How do you prevent it?", "html": "<p>Deadlock: two or more tasks wait forever for each other’s resources.\nTask A holds lock 1 and waits for lock 2, while task B holds lock 2 and\nwaits for lock 1.<\/p>\n<p><strong>Four conditions (all must be true):<\/strong> mutual\nexclusion, hold and wait, no preemption, circular wait.<\/p>\n<p><strong>Prevention:<\/strong> always acquire locks in the <strong>same\norder<\/strong>, use <strong>timeouts<\/strong> on lock attempts, hold\nlocks for a short time, avoid nested locks.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E25", "title": "Queue vs semaphore vs event flags? How should ISRs talk to tasks?", "html": "<ul>\n<li><strong>Queue:<\/strong> passes data (messages) between tasks or from\nan ISR to a task.<\/li>\n<li><strong>Semaphore:<\/strong> signals that an event happened (no\ndata).<\/li>\n<li><strong>Mutex:<\/strong> protects a shared resource.<\/li>\n<li><strong>Event flags:<\/strong> a task waits for any or all of several\nbits.<\/li>\n<\/ul>\n<p><strong>ISR rule:<\/strong> use the special ISR-safe API versions (for\nexample FreeRTOS <code>xQueueSendFromISR<\/code>,\n<code>xSemaphoreGiveFromISR<\/code>). The ISR gives a semaphore or sends\nto a queue, and a task does the real work. This is called\n<strong>deferred interrupt processing<\/strong>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E26", "title": "What is MISRA C? What is defensive programming?", "html": "<p><strong>MISRA C<\/strong> is a set of coding guidelines for safe,\nportable C in safety-critical systems (automotive, medical). Typical\nrules: no recursion, no dynamic memory, no <code>goto<\/code>, every\n<code>switch<\/code> has a <code>default<\/code>, no implicit type\nconversions that lose data, all code must be reachable, use fixed-width\ntypes.<\/p>\n<p><strong>Defensive programming habits:<\/strong><\/p>\n<ul>\n<li>Initialize every variable and pointer.<\/li>\n<li>Validate function parameters and check return values.<\/li>\n<li>Use <code>assert<\/code> for impossible conditions during\ndevelopment.<\/li>\n<li>Add a <code>default<\/code> case to every switch and\n<code>else<\/code> to every important if-chain.<\/li>\n<li>Use timeouts for hardware waits.<\/li>\n<li>Use the watchdog.<\/li>\n<li>Avoid magic numbers: use named constants and enums.<\/li>\n<li>Mark read-only data <code>const<\/code>.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E27", "title": "How do you debug an embedded problem?", "html": "<p><strong>Tools:<\/strong> JTAG/SWD debugger (breakpoints, watchpoints,\nregister view), logic analyzer and oscilloscope (check real signals),\nUART or ITM/SWO logging, toggling a spare GPIO to measure timing, map\nfile (to see memory use), HardFault handler.<\/p>\n<p><strong>Approach:<\/strong><\/p>\n<ol type=\"1\">\n<li>Reproduce the bug reliably.<\/li>\n<li>Divide the problem: hardware, clocks and pins, then driver, then\nlogic.<\/li>\n<li>Check the basics first: power, clock, peripheral clock enabled, pin\nconfiguration, pull-ups, correct baud rate.<\/li>\n<li>Use the oscilloscope to see what is really on the wires.<\/li>\n<li>Change one thing at a time.<\/li>\n<\/ol>\n<p><strong>Works in debug, fails in release?<\/strong> Suspect missing\n<code>volatile<\/code>, race conditions, uninitialized variables, timing\ndifferences and compiler optimization.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E28", "title": "How do you optimize code for size and speed?", "html": "<ul>\n<li>Compiler options: <code>-Os<\/code> (size), <code>-O2<\/code> (speed),\nand link-time optimization.<\/li>\n<li>Use the processor’s native word size (<code>uint32_t<\/code> is\nfaster than <code>uint8_t<\/code> on a 32-bit core for loop\ncounters).<\/li>\n<li>Avoid floating point and division on cores without hardware support.\nUse shifts, lookup tables or fixed-point.<\/li>\n<li>Mark small hot functions <code>static inline<\/code>.<\/li>\n<li>Pass pointers instead of large structs by value.<\/li>\n<li>Keep constant tables in Flash with <code>const<\/code>.<\/li>\n<li>Remove unused code and check the map file for large symbols\n(<code>printf<\/code>, <code>float<\/code> libraries).<\/li>\n<li>Use DMA and hardware peripherals instead of software loops.<\/li>\n<\/ul>\n<p><strong>Rule:<\/strong> measure first, then optimize. Do not\nguess.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E29", "title": "What is fixed-point arithmetic?", "html": "<p>Using integers to represent fractions by agreeing on a fixed scale,\navoiding slow floating-point.<\/p>\n<p><strong>Example 1 (scale by 100):<\/strong> store 3.14 as 314.\nAdd/subtract directly. After multiplying two scaled numbers, divide by\nthe scale once.<\/p>\n<p><strong>Example 2 (Q15):<\/strong> a 16-bit number where the value is\n<code>raw / 32768<\/code>. Multiplying two Q15 numbers:\n<code>(a * b) &gt;&gt; 15<\/code> using a 32-bit intermediate.<\/p>\n<p><strong>Example 3:<\/strong> multiply by 0.75 without float:\n<code>(x * 3) &gt;&gt; 2<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E30", "title": "What compiler attributes are common in embedded code?", "html": "<ul>\n<li><code>__attribute__((packed))<\/code>: remove struct padding.<\/li>\n<li><code>__attribute__((aligned(4)))<\/code>: force alignment.<\/li>\n<li><code>__attribute__((section(\".name\")))<\/code>: place a variable or\nfunction in a named section (for example fast RAM or a bootloader\narea).<\/li>\n<li><code>__attribute__((weak))<\/code>: a default definition that can be\noverridden (used for default ISR handlers).<\/li>\n<li><code>__attribute__((noreturn))<\/code>,\n<code>__attribute__((used))<\/code> (do not discard),\n<code>__attribute__((naked))<\/code> (no compiler\nprologue/epilogue).<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E31", "title": "Why should you not cast a received byte buffer directly to a struct?", "html": "<p>Three problems:<\/p>\n<ol type=\"1\">\n<li><strong>Padding:<\/strong> the struct may have padding bytes that the\nwire format does not have.<\/li>\n<li><strong>Alignment:<\/strong> the buffer address may be unaligned for\nthe struct, causing a fault on some cores.<\/li>\n<li><strong>Endianness:<\/strong> the sender may use a different byte\norder.<\/li>\n<\/ol>\n<p><strong>Correct approach:<\/strong> read each field from the buffer\nexplicitly, or use <code>memcpy<\/code> into a packed struct, and convert\nbyte order with <code>ntohs<\/code>/<code>ntohl<\/code> or your own\nfunctions.<\/p>\n<pre class=\"c\"><code>uint16_t value = (uint16_t)(buf[0] &lt;&lt; 8) | buf[1];   // big-endian on the wire<\/code><\/pre>\n", "hook": "", "hot": false, "lab": "endian"}, {"id": "E32", "title": "What are the common reset sources?", "html": "<p>Power-on reset (POR), brown-out reset (BOR, when the voltage dips),\nwatchdog reset (independent and window watchdog), software reset\n(<code>NVIC_SystemReset()<\/code>), external reset pin, and low-power\nwake-up reset. Most MCUs have reset-flag registers, so firmware can read\nwhy it restarted and log it, which helps a lot in field debugging.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E33", "title": "How do DMA and the cache interact?", "html": "<p>On cores with a data cache (like Cortex-M7), the CPU may read stale\ncached data after DMA writes new data to memory, or DMA may read old\nmemory before the CPU’s cached write reaches it. Fixes:\n<strong>invalidate<\/strong> the cache range before reading DMA-received\ndata, <strong>clean<\/strong> (flush) before starting a DMA transmit, or\nput DMA buffers in a non-cacheable memory region. Also align DMA buffers\nto the cache line size.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E34", "title": "What is a HAL, driver, BSP and firmware?", "html": "<ul>\n<li><strong>Firmware:<\/strong> software that runs on the embedded\ndevice.<\/li>\n<li><strong>Driver:<\/strong> code that controls a specific peripheral or\nchip.<\/li>\n<li><strong>HAL (Hardware Abstraction Layer):<\/strong> a common API over\ndifferent hardware, so application code does not depend on register\ndetails.<\/li>\n<li><strong>BSP (Board Support Package):<\/strong> the board-specific\nsetup (pins, clocks, startup code, drivers) for one board.<\/li>\n<\/ul>\n<p><strong>Trade-off:<\/strong> HAL is portable and quicker to develop,\nbut bigger and slower than direct register access.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "E35", "title": "Why mark lookup tables `const`?", "html": "<p><code>const<\/code> data is placed in Flash (<code>.rodata<\/code>)\ninstead of RAM, saving scarce RAM. Without <code>const<\/code>, the table\nis copied into RAM at startup. (On some 8-bit Harvard chips such as AVR,\nyou also need special keywords like <code>PROGMEM<\/code> to read it from\nFlash.)<\/p>\n", "hook": "", "hot": false, "lab": ""}]}, {"id": "F", "title": "Coding Questions with Logic", "short": "Coding questions", "icon": "💻", "blurb": "Coding questions with the logic explained", "questions": [{"id": "F1", "title": "Circular (ring) buffer (very common in embedded)", "html": "<pre class=\"c\"><code>#define N 8\ntypedef struct { uint8_t buf[N]; volatile uint8_t head, tail; } cb_t;\n\nbool cb_put(cb_t *c, uint8_t d) {\n    uint8_t next = (c-&gt;head + 1) % N;\n    if (next == c-&gt;tail) return false;      // full\n    c-&gt;buf[c-&gt;head] = d;\n    c-&gt;head = next;\n    return true;\n}\nbool cb_get(cb_t *c, uint8_t *d) {\n    if (c-&gt;head == c-&gt;tail) return false;   // empty\n    *d = c-&gt;buf[c-&gt;tail];\n    c-&gt;tail = (c-&gt;tail + 1) % N;\n    return true;\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> head is where the producer writes, tail is\nwhere the consumer reads. One slot is left empty so “full” and “empty”\ncan be told apart. With a single producer (ISR) and a single consumer\n(main), this works without locks. If N is a power of two, use\n<code>&amp; (N - 1)<\/code> instead of <code>%<\/code> for speed.<\/p>\n", "hook": "", "hot": true, "lab": "ring"}, {"id": "F2", "title": "Reverse a string in place", "html": "<pre class=\"c\"><code>void rev(char *s) {\n    char *e = s + strlen(s) - 1;\n    while (s &lt; e) { char t = *s; *s++ = *e; *e-- = t; }\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> two pointers from both ends swap and move\ntoward the middle. (Edge case: empty string, handle\n<code>strlen == 0<\/code>.)<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "F3", "title": "Check for a palindrome", "html": "<pre class=\"c\"><code>bool is_pal(const char *s) {\n    size_t i = 0, j = strlen(s);\n    if (j == 0) return true;\n    j--;\n    while (i &lt; j) { if (s[i++] != s[j--]) return false; }\n    return true;\n}<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F4", "title": "Write your own `strlen`, `strcpy`, `strcmp`", "html": "<pre class=\"c\"><code>size_t my_strlen(const char *s) { const char *p = s; while (*p) p++; return p - s; }\n\nchar *my_strcpy(char *d, const char *s) { char *r = d; while ((*d++ = *s++)) { } return r; }\n\nint my_strcmp(const char *a, const char *b) {\n    while (*a &amp;&amp; *a == *b) { a++; b++; }\n    return (unsigned char)*a - (unsigned char)*b;\n}<\/code><\/pre>\n", "hook": "", "hot": true, "lab": ""}, {"id": "F5", "title": "Write `atoi` (string to integer)", "html": "<pre class=\"c\"><code>int my_atoi(const char *s) {\n    int sign = 1, r = 0;\n    while (*s == &#39; &#39;) s++;\n    if (*s == &#39;-&#39;) { sign = -1; s++; } else if (*s == &#39;+&#39;) { s++; }\n    while (*s &gt;= &#39;0&#39; &amp;&amp; *s &lt;= &#39;9&#39;) { r = r * 10 + (*s - &#39;0&#39;); s++; }\n    return sign * r;\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> each digit shifts the earlier result one\ndecimal place left (<code>r * 10<\/code>) and adds the new digit\n(<code>char - '0'<\/code>). Mention that overflow is not handled here,\nand say how you would handle it.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F6", "title": "Write `itoa` (integer to string)", "html": "<pre class=\"c\"><code>void my_itoa(int n, char *buf) {\n    char tmp[12]; int i = 0;\n    int neg = (n &lt; 0);\n    unsigned u = neg ? -(unsigned)n : (unsigned)n;   // safe for INT_MIN\n    do { tmp[i++] = &#39;0&#39; + (u % 10); u /= 10; } while (u);\n    if (neg) tmp[i++] = &#39;-&#39;;\n    int j = 0;\n    while (i) buf[j++] = tmp[--i];                   // digits come out reversed\n    buf[j] = &#39;\\0&#39;;\n}<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F7", "title": "Write your own `memcpy` and `memmove`", "html": "<pre class=\"c\"><code>void *my_memcpy(void *d, const void *s, size_t n) {\n    uint8_t *dp = d; const uint8_t *sp = s;\n    while (n--) *dp++ = *sp++;\n    return d;\n}\n\nvoid *my_memmove(void *d, const void *s, size_t n) {\n    uint8_t *dp = d; const uint8_t *sp = s;\n    if (dp &lt; sp) { while (n--) *dp++ = *sp++; }          // copy forward\n    else         { dp += n; sp += n; while (n--) *--dp = *--sp; }   // copy backward\n    return d;\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> if the destination starts after the source\nand the areas overlap, copying forward would overwrite source bytes\nbefore they are read, so copy backward.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F8", "title": "Reverse a linked list", "html": "<pre class=\"c\"><code>node *reverse(node *h) {\n    node *prev = NULL, *cur = h;\n    while (cur) {\n        node *nx = cur-&gt;next;   // 1. remember next\n        cur-&gt;next = prev;       // 2. flip the link\n        prev = cur;             // 3. move prev forward\n        cur = nx;               // 4. move cur forward\n    }\n    return prev;\n}<\/code><\/pre>\n", "hook": "", "hot": true, "lab": ""}, {"id": "F9", "title": "Find the middle of a linked list and detect a loop (Floyd's algorithm)", "html": "<p>Use a <strong>slow<\/strong> pointer (1 step) and a\n<strong>fast<\/strong> pointer (2 steps).<\/p>\n<pre class=\"c\"><code>node *middle(node *h) {\n    node *s = h, *f = h;\n    while (f &amp;&amp; f-&gt;next) { s = s-&gt;next; f = f-&gt;next-&gt;next; }\n    return s;                  // when fast reaches the end, slow is at the middle\n}\nbool has_loop(node *h) {\n    node *s = h, *f = h;\n    while (f &amp;&amp; f-&gt;next) {\n        s = s-&gt;next; f = f-&gt;next-&gt;next;\n        if (s == f) return true;   // they can only meet inside a loop\n    }\n    return false;\n}<\/code><\/pre>\n", "hook": "", "hot": true, "lab": ""}, {"id": "F10", "title": "Factorial and Fibonacci (iterative)", "html": "<pre class=\"c\"><code>unsigned long fact(unsigned n) { unsigned long r = 1; while (n &gt; 1) r *= n--; return r; }\n\nunsigned fib(unsigned n) {\n    unsigned a = 0, b = 1;\n    while (n--) { unsigned t = a + b; a = b; b = t; }\n    return a;\n}<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F11", "title": "Prime check and GCD", "html": "<pre class=\"c\"><code>bool is_prime(unsigned n) {\n    if (n &lt; 2) return false;\n    for (unsigned i = 2; (unsigned long)i * i &lt;= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\nint gcd(int a, int b) { while (b) { int t = a % b; a = b; b = t; } return a; }   // Euclid<\/code><\/pre>\n<p><strong>Logic:<\/strong> a factor larger than the square root must\npair with one smaller than it, so checking up to the square root is\nenough.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F12", "title": "Find the largest and second-largest in an array", "html": "<pre class=\"c\"><code>int first = INT_MIN, second = INT_MIN;\nfor (int i = 0; i &lt; n; i++) {\n    if (a[i] &gt; first)                    { second = first; first = a[i]; }\n    else if (a[i] &gt; second &amp;&amp; a[i] != first) { second = a[i]; }\n}<\/code><\/pre>\n<p>One pass, O(n), no sorting needed.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F13", "title": "Binary search and bubble sort", "html": "<pre class=\"c\"><code>int bsearch_i(const int *a, int n, int key) {      // array must be sorted\n    int lo = 0, hi = n - 1;\n    while (lo &lt;= hi) {\n        int mid = lo + (hi - lo) / 2;              // avoids overflow of (lo + hi)\n        if (a[mid] == key) return mid;\n        if (a[mid] &lt; key) lo = mid + 1; else hi = mid - 1;\n    }\n    return -1;\n}\n\nvoid bubble(int *a, int n) {\n    for (int i = 0; i &lt; n - 1; i++) {\n        bool swapped = false;\n        for (int j = 0; j &lt; n - 1 - i; j++)\n            if (a[j] &gt; a[j + 1]) { int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; swapped = true; }\n        if (!swapped) break;                       // already sorted\n    }\n}<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F14", "title": "Find the missing number in 1..N", "html": "<pre class=\"c\"><code>int missing(const int *a, int n) {        // array has n-1 numbers from 1..n\n    int x = 0;\n    for (int i = 1; i &lt;= n; i++) x ^= i;\n    for (int i = 0; i &lt; n - 1; i++) x ^= a[i];\n    return x;\n}<\/code><\/pre>\n<p>Alternative: <code>n*(n+1)/2 - sum(a)<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F15", "title": "Find the size of a variable without using `sizeof`", "html": "<pre class=\"c\"><code>int x;\nsize_t size = (char *)(&amp;x + 1) - (char *)&amp;x;<\/code><\/pre>\n<p><strong>Logic:<\/strong> <code>&amp;x + 1<\/code> moves by the size of\nx, so subtracting the byte addresses gives the size.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F16", "title": "Write `MIN`, `SWAP` macros. Why `do { } while (0)`?", "html": "<pre class=\"c\"><code>#define MIN(a, b) ((a) &lt; (b) ? (a) : (b))\n#define SWAP(t, a, b) do { t _tmp = (a); (a) = (b); (b) = _tmp; } while (0)<\/code><\/pre>\n<p><strong>Why <code>do-while(0)<\/code>:<\/strong> it makes a\nmulti-statement macro behave like one statement, so\n<code>if (x) SWAP(int, a, b); else ...<\/code> compiles correctly. It\nalso gives the temp variable its own scope.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F17", "title": "What are `#` and `##` in macros? Write `offsetof`.", "html": "<pre class=\"c\"><code>#define STR(x)    #x          // STR(hello) -&gt; &quot;hello&quot;   (stringify)\n#define CAT(a, b) a##b        // CAT(my, Var) -&gt; myVar   (token pasting)\n#define OFFSETOF(type, member) ((size_t)&amp;(((type *)0)-&gt;member))<\/code><\/pre>\n<p><strong>Logic of OFFSETOF:<\/strong> pretend a struct sits at address\n0, then the address of its member is the offset. Nothing is really\ndereferenced because only the address is taken.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F18", "title": "Debounce a button in software", "html": "<p>Call this every 10 ms:<\/p>\n<pre class=\"c\"><code>bool debounce(bool raw) {\n    static uint8_t cnt = 0;\n    static bool stable = false;\n    if (raw == stable) { cnt = 0; }\n    else if (++cnt &gt;= 5) { stable = raw; cnt = 0; }   // changed for 5 samples in a row = real\n    return stable;\n}<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F19", "title": "Implement a simple state machine", "html": "<pre class=\"c\"><code>typedef enum { ST_IDLE, ST_PRESSED, ST_HELD } state_t;\n\nvoid button_fsm(bool btn) {\n    static state_t st = ST_IDLE;\n    static uint16_t t = 0;\n    switch (st) {\n    case ST_IDLE:    if (btn) { st = ST_PRESSED; t = 0; } break;\n    case ST_PRESSED: if (!btn) st = ST_IDLE;\n                     else if (++t &gt; 100) st = ST_HELD; break;\n    case ST_HELD:    if (!btn) st = ST_IDLE; break;\n    default:         st = ST_IDLE; break;       // always handle unexpected values\n    }\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> a state variable plus a <code>switch<\/code>.\nEach state decides the next state based on inputs. State machines make\nembedded logic clear, testable and non-blocking.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F20", "title": "Toggle an LED without blocking (using a tick)", "html": "<pre class=\"c\"><code>volatile uint32_t ms_tick;                     // incremented in SysTick_Handler\nvoid SysTick_Handler(void) { ms_tick++; }\n\nint main(void) {\n    uint32_t last = 0;\n    while (1) {\n        if ((ms_tick - last) &gt;= 500U) { last = ms_tick; led_toggle(); }\n        /* other work keeps running */\n    }\n}<\/code><\/pre>\n<p>(On a 32-bit MCU, reading a <code>uint32_t<\/code> is atomic. On 8-bit\nMCUs, disable interrupts while reading it.)<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "F21", "title": "Convert a number between endianness / pack two bytes", "html": "<pre class=\"c\"><code>uint16_t swap16(uint16_t x) { return (uint16_t)((x &lt;&lt; 8) | (x &gt;&gt; 8)); }\nuint16_t from_be(const uint8_t *b) { return (uint16_t)((b[0] &lt;&lt; 8) | b[1]); }<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}]}, {"id": "G", "title": "Tricky Output Questions", "short": "Tricky outputs", "icon": "🎭", "blurb": "Tricky output questions: say the why aloud", "questions": [{"id": "G1", "title": "27 tricky output questions with reasons", "html": "<p>Say your reasoning aloud. Interviewers care about the “why”.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>#<\/th>\n<th>Code<\/th>\n<th>Output<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td><code>printf(\"%d\", sizeof('a'));<\/code><\/td>\n<td>4<\/td>\n<td>In C, a character constant is an <code>int<\/code> (in C++ it is\n1)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td><code>unsigned char x = 255; x++;<\/code><\/td>\n<td>x becomes 0<\/td>\n<td>Unsigned wraparound is well defined<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td><code>if (x = 5)<\/code><\/td>\n<td>Always true<\/td>\n<td><code>=<\/code> assigns (value 5), <code>==<\/code> compares<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td><code>SQUARE(2+3)<\/code> with\n<code>#define SQUARE(x) x*x<\/code><\/td>\n<td>11<\/td>\n<td>Text replacement gives <code>2+3*2+3<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td><code>int s=-1; unsigned u=1; s &lt; u<\/code><\/td>\n<td>False<\/td>\n<td>-1 is converted to 4294967295<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6<\/td>\n<td><code>printf(\"%d\", 5/2);<\/code><\/td>\n<td>2<\/td>\n<td>Integer division truncates<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>7<\/td>\n<td><code>printf(\"%d\", -5 % 3);<\/code><\/td>\n<td>-2<\/td>\n<td>In C99 the result takes the sign of the dividend<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>8<\/td>\n<td><code>int a=5; printf(\"%d %d\", a++, ++a);<\/code><\/td>\n<td>Undefined<\/td>\n<td>Unsequenced modification of <code>a<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>9<\/td>\n<td><code>if (10 &gt; 5 &gt; 3)<\/code><\/td>\n<td>False<\/td>\n<td><code>(10 &gt; 5)<\/code> is 1, and <code>1 &gt; 3<\/code> is\nfalse<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>10<\/td>\n<td><code>printf(\"%d\", 10 == 10 == 10);<\/code><\/td>\n<td>0<\/td>\n<td><code>(10 == 10)<\/code> is 1, and <code>1 == 10<\/code> is 0<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>11<\/td>\n<td><code>printf(\"%d %d\", !5, !!5);<\/code><\/td>\n<td>0 1<\/td>\n<td><code>!<\/code> gives 0 or 1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>12<\/td>\n<td><code>char c = 200; printf(\"%d\", c);<\/code><\/td>\n<td>-56 (signed char) or 200 (unsigned char)<\/td>\n<td>Plain <code>char<\/code> signedness is implementation-defined. It is\nunsigned on ARM GCC<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>13<\/td>\n<td><code>unsigned u = 0; u--; printf(\"%u\", u);<\/code><\/td>\n<td>4294967295<\/td>\n<td>Unsigned wraparound<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>14<\/td>\n<td><code>short s = 32767; s++;<\/code><\/td>\n<td>-32768 (typically)<\/td>\n<td>Computed as int 32768, converted back to short. Result is\nimplementation-defined<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>15<\/td>\n<td><code>float f = 0.1; if (f == 0.1)<\/code><\/td>\n<td>False<\/td>\n<td><code>f<\/code> is a float, <code>0.1<\/code> is a double, and they\ndiffer in precision<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>16<\/td>\n<td><code>printf(\"%s\", \"hello\" + 1);<\/code><\/td>\n<td>ello<\/td>\n<td>Adding 1 moves the pointer past the first character<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>17<\/td>\n<td><code>char s[] = \"abc\"; sizeof(s), strlen(s)<\/code><\/td>\n<td>4 and 3<\/td>\n<td><code>sizeof<\/code> counts the <code>'\\0'<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>18<\/td>\n<td><code>int a[] = {10,20,30}; printf(\"%d\", *a + 1);<\/code><\/td>\n<td>11<\/td>\n<td><code>*a<\/code> is 10, then +1. Compare with <code>*(a+1)<\/code>\nwhich is 20<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>19<\/td>\n<td><code>#define MAX(a,b) a&gt;b?a:b<\/code> then\n<code>MAX(2,1)*10<\/code><\/td>\n<td>2<\/td>\n<td>Expands to <code>2&gt;1?2:1*10<\/code>. Always parenthesize\nmacros<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>20<\/td>\n<td><code>printf(\"%d\", printf(\"Hi\"));<\/code><\/td>\n<td>Hi2<\/td>\n<td>The inner printf prints “Hi” and returns 2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>21<\/td>\n<td><code>int i=0; while (i++ &lt; 3); printf(\"%d\", i);<\/code><\/td>\n<td>4<\/td>\n<td>The condition is checked 4 times, i is incremented each time<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>22<\/td>\n<td><code>char *p = \"abc\"; p[0] = 'x';<\/code><\/td>\n<td>Crash / undefined<\/td>\n<td>String literal is in read-only memory<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>23<\/td>\n<td><code>int arr[5] = {1,2};<\/code><\/td>\n<td>1 2 0 0 0<\/td>\n<td>Remaining elements are zero-initialized<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>24<\/td>\n<td><code>static int x;<\/code> vs local <code>int y;<\/code> (not\nset)<\/td>\n<td>x = 0, y = garbage<\/td>\n<td>Statics are zero-initialized, locals are not<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>25<\/td>\n<td><code>sizeof(arr)/sizeof(arr[0])<\/code> inside a function whose\nparameter is <code>int *arr<\/code><\/td>\n<td>Wrong (1 or 2)<\/td>\n<td>The parameter is a pointer, so <code>sizeof<\/code> gives pointer\nsize / int size<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>26<\/td>\n<td><code>switch (x) { case 1: printf(\"A\"); case 2: printf(\"B\"); }<\/code>\nwith x = 1<\/td>\n<td>AB<\/td>\n<td>No <code>break<\/code>, so execution falls through<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>27<\/td>\n<td><code>int x = 5; x = x++;<\/code><\/td>\n<td>Undefined<\/td>\n<td>Modifying x twice without a sequence point<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "hook": "", "hot": true, "lab": "wrap"}]}, {"id": "H", "title": "Cheat Sheet, HR Questions and Mock Round", "short": "Interview-day kit", "icon": "🎯", "blurb": "Cheat sheet, project questions, rapid-fire round, study plan", "questions": [{"id": "H1", "title": "One-page memory hooks (revise the night before)", "html": "<ul>\n<li><strong>volatile:<\/strong> “hardware or ISR can change it behind my\nback.”<\/li>\n<li><strong>static:<\/strong> “stays alive, stays private.”<\/li>\n<li><strong>const pointers:<\/strong> “read right to left.”<\/li>\n<li><strong>memory layout:<\/strong> “Text, Data, BSS, Heap, Stack.”<\/li>\n<li><strong>compilation:<\/strong> “Preprocess, Compile, Assemble,\nLink.”<\/li>\n<li><strong>bit operations:<\/strong> “OR sets, AND-NOT clears, XOR\ntoggles, shift-AND checks.”<\/li>\n<li><strong>ISR:<\/strong> “short, no blocking, flag it, clear it.”<\/li>\n<li><strong>race condition:<\/strong> “shared data + interrupt = protect\nit.”<\/li>\n<li><strong>priority inversion fix:<\/strong> “inherit.”<\/li>\n<li><strong>startup:<\/strong> “SP, Reset_Handler, copy .data, zero .bss,\nmain.”<\/li>\n<li><strong>Flash:<\/strong> “write 1 to 0, erase sector to get 1.”<\/li>\n<li><strong>UART/SPI/I2C/CAN:<\/strong> “two talk, fast, few wires,\nrobust.”<\/li>\n<li><strong>I2C:<\/strong> “open-drain, pull-ups, ACK every 9th\nclock.”<\/li>\n<li><strong>PWM:<\/strong> “ARR sets frequency, CCR sets duty.”<\/li>\n<li><strong>ADC:<\/strong> “1 LSB = Vref / 2^N.”<\/li>\n<li><strong>malloc in embedded:<\/strong> “fragmentation, no determinism,\nleaks.”<\/li>\n<li><strong>precedence trap:<\/strong> “parenthesize\n<code>(reg &amp; MASK) == MASK<\/code>.”<\/li>\n<li><strong>signed vs unsigned:<\/strong> “never compare them.”<\/li>\n<li><strong>works in debug, fails in release:<\/strong> “volatile, race,\nuninitialized.”<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "H2", "title": "HR and project questions (prepare these in your own words)", "html": "<p><strong>Tell me about yourself.<\/strong> Use this template: current\nstatus (final-year student or role), your core skills (C, embedded C,\nmicrocontroller name, protocols you used), one project in one sentence,\nand what you are looking for. Keep it to 60 to 90 seconds.<\/p>\n<p><strong>Explain your project.<\/strong> Use this order: (1) what\nproblem it solves, (2) hardware used (MCU, sensors, modules), (3) your\nrole, (4) the software design (drivers, ISRs, state machine or RTOS),\n(5) one challenge you hit and how you solved it, (6) the result. Be\nready to explain any line of your project code and why you chose each\nperipheral.<\/p>\n<p><strong>Tell me about a bug you debugged.<\/strong> Use STAR:\nSituation (what failed), Task (your job), Action (what you checked,\ntools you used, what you found), Result (the fix and what you learned).\nA good example: “UART data was corrupted; I used a logic analyzer and\nfound a baud rate mismatch caused by the wrong clock configuration.”<\/p>\n<p><strong>Why embedded systems?<\/strong> Talk about enjoying the\nconnection between software and real hardware, and the challenge of\nlimited memory and real-time constraints.<\/p>\n<p><strong>What if you do not know the answer?<\/strong> Say: “I have not\nworked with that directly. From what I know, it works like…, and I would\ncheck the datasheet or reference manual to confirm.” Honest and\nstructured beats guessing.<\/p>\n<p><strong>Questions you can ask the interviewer:<\/strong> What\nmicrocontrollers and tools does the team use? What does a new engineer\nwork on in the first three months? How do you test and debug\nfirmware?<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "H3", "title": "Rapid-fire mock round (cover the answers, say them aloud)", "html": "<ol type=\"1\">\n<li>What is <code>volatile<\/code>? <strong>Answer:<\/strong> it stops the\ncompiler from optimizing away reads and writes of a variable that can\nchange outside the program flow (registers, ISR-shared data).<\/li>\n<li><code>const volatile<\/code> use? <strong>Answer:<\/strong> a\nread-only hardware status register.<\/li>\n<li>Set, clear, toggle bit 5? <strong>Answer:<\/strong>\n<code>|= (1U&lt;&lt;5)<\/code>, <code>&amp;= ~(1U&lt;&lt;5)<\/code>,\n<code>^= (1U&lt;&lt;5)<\/code>.<\/li>\n<li>Static local vs global? <strong>Answer:<\/strong> a static local has\nfunction scope but lives for the whole program. A global has file or\nprogram scope.<\/li>\n<li>Stack vs heap? <strong>Answer:<\/strong> stack is automatic, fast and\nsmall. Heap is manual, slower, and can fragment.<\/li>\n<li>Why avoid <code>malloc<\/code> in embedded? <strong>Answer:<\/strong>\nfragmentation, non-deterministic timing, leaks, little RAM.<\/li>\n<li>What does the startup code do? <strong>Answer:<\/strong> set SP, copy\n<code>.data<\/code> from Flash to RAM, zero <code>.bss<\/code>, init the\nsystem, call <code>main<\/code>.<\/li>\n<li>Where do <code>const<\/code> globals go? <strong>Answer:<\/strong>\n<code>.rodata<\/code> in Flash.<\/li>\n<li>Where do uninitialized globals go? <strong>Answer:<\/strong>\n<code>.bss<\/code>, zeroed at startup.<\/li>\n<li>Array vs pointer? <strong>Answer:<\/strong> array is a fixed block\nwhose name decays to a pointer. <code>sizeof<\/code> and assignment\ndiffer.<\/li>\n<li>Struct padding? <strong>Answer:<\/strong> extra bytes inserted for\nalignment. Reorder members to reduce them.<\/li>\n<li>Structure vs union? <strong>Answer:<\/strong> a structure has\nseparate memory per member. A union shares one block, size equals the\nlargest member.<\/li>\n<li>What is an ISR rule you must follow? <strong>Answer:<\/strong> keep\nit short, no blocking, no <code>printf<\/code>/<code>malloc<\/code>,\nvolatile shared data, clear the flag.<\/li>\n<li>How is a race condition solved? <strong>Answer:<\/strong> critical\nsection, atomic operation, mutex, or a lock-free queue.<\/li>\n<li>Mutex vs semaphore? <strong>Answer:<\/strong> a mutex has an owner\nand protects a resource. A semaphore signals events.<\/li>\n<li>Priority inversion fix? <strong>Answer:<\/strong> priority\ninheritance.<\/li>\n<li>I2C needs pull-ups because? <strong>Answer:<\/strong> the lines are\nopen-drain, so devices can only pull low.<\/li>\n<li>SPI vs I2C? <strong>Answer:<\/strong> SPI is faster and full duplex\nwith more wires. I2C uses two wires with addressing and ACK.<\/li>\n<li>What is a watchdog? <strong>Answer:<\/strong> a timer that resets the\nMCU if the software stops refreshing it.<\/li>\n<li>How does an ADC reading convert to voltage? <strong>Answer:<\/strong>\n<code>Vin = reading * Vref / (2^N - 1)<\/code>.<\/li>\n<li>PWM duty cycle? <strong>Answer:<\/strong>\n<code>CCR / (ARR + 1)<\/code>.<\/li>\n<li>What is DMA? <strong>Answer:<\/strong> hardware that transfers data\nbetween memory and peripherals without the CPU.<\/li>\n<li>Why does the code work at <code>-O0<\/code> but not <code>-O2<\/code>?\n<strong>Answer:<\/strong> missing <code>volatile<\/code>, race conditions,\nor undefined behavior.<\/li>\n<li>What is a HardFault? <strong>Answer:<\/strong> a CPU exception from a\nserious error such as a bad pointer, unaligned access or stack\noverflow.<\/li>\n<li>Endianness of ARM Cortex-M? <strong>Answer:<\/strong>\nlittle-endian.<\/li>\n<\/ol>\n", "hook": "", "hot": false, "lab": ""}, {"id": "H4", "title": "Study plan and final checklist", "html": "<p><strong>Study plan (7 days):<\/strong><\/p>\n<ul>\n<li>Day 1: Part A. Day 2: Part B. Day 3: Part C (write each bit trick by\nhand).<\/li>\n<li>Day 4: Part D. Day 5: Part E. Day 6: Parts F and G (code on paper,\nno IDE).<\/li>\n<li>Day 7: Part H, rapid-fire out loud, and revise your own\nproject.<\/li>\n<\/ul>\n<p><strong>Final checklist:<\/strong><\/p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />I can explain <code>volatile<\/code>,\n<code>static<\/code>, <code>const<\/code> and pointer rules without\nhesitation.<\/label><\/li>\n<li><label><input type=\"checkbox\" />I can write the memory layout and\nstartup sequence from memory.<\/label><\/li>\n<li><label><input type=\"checkbox\" />I can set, clear, toggle, check and\nmodify bit fields without errors.<\/label><\/li>\n<li><label><input type=\"checkbox\" />I can explain my project, every\nperipheral I used, and one bug I fixed.<\/label><\/li>\n<li><label><input type=\"checkbox\" />I can write a circular buffer,\nstring reverse and linked-list reverse on paper.<\/label><\/li>\n<li><label><input type=\"checkbox\" />I can explain UART, SPI and I2C in\nmy own words.<\/label><\/li>\n<li><label><input type=\"checkbox\" />I will use the 3-step formula:\ndefinition, logic, example.<\/label><\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}]}], "rapid": [{"q": "What is <code>volatile<\/code>?", "a": "it stops the compiler from optimizing away reads and writes of a variable that can change outside the program flow (registers, ISR-shared data)."}, {"q": "<code>const volatile<\/code> use?", "a": "a read-only hardware status register."}, {"q": "Set, clear, toggle bit 5?", "a": "<code>|= (1U&lt;&lt;5)<\/code>, <code>&amp;= ~(1U&lt;&lt;5)<\/code>, <code>^= (1U&lt;&lt;5)<\/code>."}, {"q": "Static local vs global?", "a": "a static local has function scope but lives for the whole program. A global has file or program scope."}, {"q": "Stack vs heap?", "a": "stack is automatic, fast and small. Heap is manual, slower, and can fragment."}, {"q": "Why avoid <code>malloc<\/code> in embedded?", "a": "fragmentation, non-deterministic timing, leaks, little RAM."}, {"q": "What does the startup code do?", "a": "set SP, copy <code>.data<\/code> from Flash to RAM, zero <code>.bss<\/code>, init the system, call <code>main<\/code>."}, {"q": "Where do <code>const<\/code> globals go?", "a": "<code>.rodata<\/code> in Flash."}, {"q": "Where do uninitialized globals go?", "a": "<code>.bss<\/code>, zeroed at startup."}, {"q": "Array vs pointer?", "a": "array is a fixed block whose name decays to a pointer. <code>sizeof<\/code> and assignment differ."}, {"q": "Struct padding?", "a": "extra bytes inserted for alignment. Reorder members to reduce them."}, {"q": "Structure vs union?", "a": "a structure has separate memory per member. A union shares one block, size equals the largest member."}, {"q": "What is an ISR rule you must follow?", "a": "keep it short, no blocking, no <code>printf<\/code>/<code>malloc<\/code>, volatile shared data, clear the flag."}, {"q": "How is a race condition solved?", "a": "critical section, atomic operation, mutex, or a lock-free queue."}, {"q": "Mutex vs semaphore?", "a": "a mutex has an owner and protects a resource. A semaphore signals events."}, {"q": "Priority inversion fix?", "a": "priority inheritance."}, {"q": "I2C needs pull-ups because?", "a": "the lines are open-drain, so devices can only pull low."}, {"q": "SPI vs I2C?", "a": "SPI is faster and full duplex with more wires. I2C uses two wires with addressing and ACK."}, {"q": "What is a watchdog?", "a": "a timer that resets the MCU if the software stops refreshing it."}, {"q": "How does an ADC reading convert to voltage?", "a": "<code>Vin = reading * Vref / (2^N - 1)<\/code>."}, {"q": "PWM duty cycle?", "a": "<code>CCR / (ARR + 1)<\/code>."}, {"q": "What is DMA?", "a": "hardware that transfers data between memory and peripherals without the CPU."}, {"q": "Why does the code work at <code>-O0<\/code> but not <code>-O2<\/code>?", "a": "missing <code>volatile<\/code>, race conditions, or undefined behavior."}, {"q": "What is a HardFault?", "a": "a CPU exception from a serious error such as a bad pointer, unaligned access or stack overflow."}, {"q": "Endianness of ARM Cortex-M?", "a": "little-endian."}]};
</script>
<script>
// Each item: t = topic, q = question, code = optional snippet, o = options, a = index of right option, w = why
const QUIZ = [
 {t:'C basics', q:'What does `static` do to a local variable?', o:['Makes it visible to other files','Keeps its value between calls (lifetime = whole program)','Moves it to the heap','Makes it read-only'], a:1,
  w:'A static local lives in .data/.bss, not on the stack, so it survives between calls. Scope is still just that function.'},
 {t:'C basics', q:'What does `const int *p` mean?', o:['p cannot move to another address','The int cannot be changed through p','Neither p nor the int can change','p must be NULL'], a:1,
  w:'Read right to left: p is a pointer to a const int. The data is protected, the pointer is free to move.'},
 {t:'Memory', q:'Where does an uninitialized global variable live?', o:['.data','.bss','Stack','.rodata'], a:1,
  w:'.bss holds zero-initialized globals and statics. The startup code zeroes it in RAM before main().'},
 {t:'C basics', q:'What happens here?', code:'char *s = "hi";\ns[0] = \'x\';', o:['Works fine','Undefined behavior (string literal is read-only)','Compile error always','s becomes NULL'], a:1,
  w:'A string literal lives in read-only memory. Use `char s[] = "hi";` for a modifiable copy.'},
 {t:'C basics', q:'On a 32-bit system, `int *p` holds address 1000. What is the address of `p + 2`?', o:['1002','1004','1008','1016'], a:2,
  w:'Pointer arithmetic scales by sizeof(int) = 4, so 1000 + 2 x 4 = 1008.'},
 {t:'C basics', q:'Size of this struct on a 32-bit ARM?', code:'struct S { char a; int b; char c; };', o:['6','8','12','9'], a:2,
  w:'a(1)+3 padding, b(4), c(1)+3 padding = 12. Reorder as int, char, char and it becomes 8.'},
 {t:'C basics', q:'Which of these is undefined behavior?', o:['Unsigned integer overflow','Signed integer overflow','5 / 2','Right-shifting an unsigned value'], a:1,
  w:'Unsigned overflow wraps (well defined). Signed overflow is undefined, so the compiler may assume it never happens.'},
 {t:'C basics', q:'What is the value of SQ(2+3)?', code:'#define SQ(x) x*x', o:['25','11','10','13'], a:1,
  w:'Macros are text replacement: 2+3*2+3 = 11. Write ((x)*(x)) to be safe, or use an inline function.'},
 {t:'C basics', q:'In C, what is `sizeof(\'a\')` on a typical 32/64-bit machine?', o:['1','2','4','8'], a:2,
  w:'A character constant has type int in C (in C++ it is char, so 1).'},
 {t:'C basics', q:'Which build stage reports "undefined reference to foo"?', o:['Preprocessor','Compiler','Assembler','Linker'], a:3,
  w:'The function was declared but no object file defines it. Resolving symbols is the linker’s job.'},
 {t:'Embedded', q:'What is the main job of `volatile`?', o:['Make code run faster','Stop the compiler caching or removing reads/writes of the variable','Make the access atomic','Store the variable in Flash'], a:1,
  w:'It tells the compiler the value can change outside normal program flow (hardware, ISR). It does NOT make access atomic.'},
 {t:'Embedded', q:'An ISR sets `flag = 1`, but main’s `while(!flag);` never exits at -O2. Most likely cause?', o:['Stack overflow','Missing volatile on flag','Wrong baud rate','Flash wear'], a:1,
  w:'Without volatile the compiler reads flag once into a register and loops forever. At -O0 it often "works", which hides the bug.'},
 {t:'C basics', q:'Two buffers overlap. Which function is safe?', o:['memcpy','memmove','strcpy','strncpy'], a:1,
  w:'memmove handles overlap (copies backward when needed). memcpy with overlap is undefined.'},
 {t:'Bits', q:'What is wrong with this check?', code:'if (reg & MASK == MASK)', o:['Nothing','== binds tighter than &, so it computes reg & (MASK == MASK)','MASK must be a variable','It needs volatile'], a:1,
  w:'Always write (reg & MASK) == MASK. Precedence of bitwise operators is lower than comparisons.'},
 {t:'C basics', q:'What does this print?', code:'int s = -1; unsigned u = 1;\nprintf("%d", s < u);', o:['1','0','Compile error','Undefined'], a:1,
  w:'s is converted to unsigned (4294967295), so s < u is false. Never compare signed with unsigned.'},
 {t:'Bits', q:'Which statement SETS bit 3 of reg?', o:['reg &= ~(1U << 3);','reg |= (1U << 3);','reg ^= (1U << 3);','reg = 1U << 3;'], a:1,
  w:'OR with a mask sets the bit. The last option would also wipe every other bit.'},
 {t:'Bits', q:'Which statement CLEARS bit 3 of reg?', o:['reg |= (1U << 3);','reg &= (1U << 3);','reg &= ~(1U << 3);','reg ^= (1U << 3);'], a:2,
  w:'AND with the inverted mask forces that bit to 0 and keeps all others.'},
 {t:'Bits', q:'What does `n & (n - 1)` do?', o:['Sets the lowest bit','Clears the lowest set bit','Toggles all bits','Reverses bits'], a:1,
  w:'Subtracting 1 flips the lowest set bit and everything below it, so the AND removes that lowest set bit. Used to count bits and test powers of two.'},
 {t:'Bits', q:'Power-of-two test for n > 0:', o:['n & 1','!(n & (n - 1))','n % 3 == 0','n >> 1'], a:1,
  w:'A power of two has exactly one set bit, and n & (n-1) clears it, leaving 0.'},
 {t:'Bits', q:'What is `a ^ a`?', o:['a','1','0','2a'], a:2,
  w:'XOR of equal values is 0. That is why XOR-ing a whole array finds the one number without a pair.'},
 {t:'Bits', q:'Why write `1U << 31` instead of `1 << 31`?', o:['It is faster','Shifting into the sign bit of a signed int is undefined','1 is not an integer','U makes it volatile'], a:1,
  w:'Use unsigned types for bit operations to avoid undefined and implementation-defined behavior.'},
 {t:'Embedded', q:'Which is OK inside an ISR?', o:['printf of a long message','malloc a buffer','Set a flag and clear the interrupt source','delay_ms(100)'], a:2,
  w:'Keep ISRs short: record the event, clear the flag, leave the heavy work to main or a task.'},
 {t:'Embedded', q:'Which registers does Cortex-M hardware stack automatically on interrupt entry?', o:['R0–R3, R12, LR, PC, xPSR','All of R0–R12','Only PC','Nothing, software must do it'], a:0,
  w:'That is why a normal C function can be an ISR on Cortex-M. The rest (R4–R11) are saved by the handler if it uses them.'},
 {t:'RTOS', q:'What is the usual fix for priority inversion?', o:['Disable interrupts','Priority inheritance','Bigger stack','Use a semaphore instead'], a:1,
  w:'The low-priority task holding the mutex temporarily inherits the high priority so a medium task cannot starve it.'},
 {t:'RTOS', q:'Mutex vs semaphore: the key difference?', o:['Mutex is faster','Mutex has an owner (only the locker can unlock)','Semaphore cannot be used in ISRs','No difference'], a:1,
  w:'A mutex protects a resource and has ownership. A semaphore is a signal and has no owner.'},
 {t:'Hardware', q:'Flash memory write rule?', o:['Any bit can be written to 0 or 1 freely','Writing changes bits 1→0; erasing a whole sector sets them back to 1','Writing needs an ISR','Flash is volatile'], a:1,
  w:'You must erase a sector before rewriting. Flash also wears out, so avoid frequent writes to one spot.'},
 {t:'Protocols', q:'Why does I2C need pull-up resistors?', o:['To save power','Lines are open-drain: devices can only pull low','To set the address','To reduce noise only'], a:1,
  w:'Nobody drives the line high. The pull-up resistors do, which also lets many devices share the wires safely.'},
 {t:'Protocols', q:'What selects the SPI mode (0–3)?', o:['Baud rate','CPOL and CPHA','Chip select count','Parity'], a:1,
  w:'CPOL = idle clock level, CPHA = which edge samples data. Master and slave must match.'},
 {t:'Protocols', q:'UART 9600 baud, 8N1. About how many bytes per second?', o:['9600','1200','960','96'], a:2,
  w:'Each byte uses 10 bits (start + 8 data + stop), so 9600 / 10 = 960 bytes per second.'},
 {t:'Hardware', q:'12-bit ADC, Vref = 3.3 V. Size of 1 LSB?', o:['3.3 mV','0.8 mV','8 mV','0.08 mV'], a:1,
  w:'3.3 V / 4096 ≈ 0.806 mV.'},
 {t:'Hardware', q:'Timer clock 16 MHz, PSC = 15, ARR = 999. PWM frequency?', o:['1 kHz','16 kHz','100 Hz','10 kHz'], a:0,
  w:'f = 16 MHz / ((15+1) x (999+1)) = 1 kHz. Duty = CCR / (ARR+1).'},
 {t:'Embedded', q:'Why avoid malloc in embedded firmware?', o:['It is illegal in C','Fragmentation, non-deterministic timing and leaks','It is too fast','It only works with an RTOS'], a:1,
  w:'Use static allocation or fixed-size pools so memory use and timing are predictable.'},
 {t:'Embedded', q:'What happens first after reset on Cortex-M?', o:['main() runs','SP and Reset_Handler are loaded from the vector table','.bss is freed','The watchdog is kicked'], a:1,
  w:'Order: load SP → Reset_Handler → copy .data and zero .bss → SystemInit → main().'},
 {t:'Embedded', q:'A status register has write-1-to-clear flags. What is wrong with `STATUS |= FLAG_A;`?', o:['Nothing','It clears every other flag that was set','It sets FLAG_A forever','It needs a cast'], a:1,
  w:'The OR writes back 1s for all currently set flags, clearing them all. Use `STATUS = FLAG_A;`.'},
 {t:'Protocols', q:'On a CAN bus, which message wins arbitration?', o:['The longest','The lowest ID','The highest ID','The first node'], a:1,
  w:'Lower ID = higher priority, and the winner’s message is not corrupted (non-destructive arbitration).'},
 {t:'Embedded', q:'What is a watchdog timer for?', o:['Counting seconds','Resetting the MCU if software stops refreshing it','Debouncing buttons','Encrypting data'], a:1,
  w:'It recovers from hangs. Kick it only from healthy code, not blindly from a timer ISR.'},
 {t:'Embedded', q:'What makes a function reentrant?', o:['It is short','It uses no static/global state, only locals and parameters','It is declared inline','It uses volatile'], a:1,
  w:'A reentrant function can be interrupted and called again safely, which is required for code shared with ISRs.'},
 {t:'Memory', q:'On little-endian ARM, 0x12345678 is stored. Which byte is at the lowest address?', o:['0x12','0x34','0x56','0x78'], a:3,
  w:'Little-endian stores the least significant byte first, so the lowest address holds 0x78.'},
 {t:'C basics', q:'What does this print?', code:'printf("%d", 10 == 10 == 10);', o:['1','0','10','Compile error'], a:1,
  w:'(10 == 10) is 1, then 1 == 10 is 0.'},
 {t:'C basics', q:'What is x after this?', code:'unsigned char x = 255;\nx++;', o:['256','0','-1','Undefined'], a:1,
  w:'Unsigned arithmetic wraps around: 255 + 1 becomes 0.'},
 {t:'Embedded', q:'Code works at -O0 but breaks at -O2. What do you suspect first?', o:['Bad solder joint','Missing volatile, race condition or undefined behavior','Flash too small','Wrong crystal'], a:1,
  w:'Optimization exposes bugs the compiler was legally allowed to exploit.'},
 {t:'Memory', q:'Which segment holds `const` tables and string literals?', o:['.bss','.rodata (in Flash)','Stack','Heap'], a:1,
  w:'Read-only data stays in Flash, saving RAM on a microcontroller.'},
 {t:'C basics', q:'`*p++` does what?', o:['Increments the data p points to','Reads *p, then moves the pointer forward','Moves the pointer, then reads','Syntax error'], a:1,
  w:'Postfix ++ binds tighter than *, so it is *(p++): use the value, then advance the pointer. `(*p)++` changes the data.'}
];

</script>
<script>
/* All labs: each returns nothing or a cleanup function. Helpers ($, h, hex, esc) come from core.js and are used only at run time. */

const num = (val, min, max, fn, step) => h('input', { type: 'number', value: val, min, max, step: step || 1, oninput: e => { const x = Number(e.target.value); if (!Number.isNaN(x)) fn(x); } });

/* ===== 1. BIT PLAYGROUND ===== */
function labBits(root) {
  let w = 8, v = 0xA5, n = 3, pos = 4, len = 3, fv = 5, last = null;
  const M = () => w === 32 ? 0xFFFFFFFF : ((1 << w) - 1);
  const bin = x => (x >>> 0).toString(2).padStart(w, '0');
  const sp = (s, mk) => s.split('').map((c, i) => (i && i % 4 === 0 ? ' ' : '') + (mk.includes(w - 1 - i) ? `<span class="m">${c}</span>` : c)).join('');
  const bitsEl = h('div', { class: 'bits' }), eqEl = h('div', { class: 'eq' }), rd = h('div', { class: 'row mono' });
  const marks = () => last ? last.mark : [];
  function refresh() {
    bitsEl.innerHTML = '';
    for (let i = w - 1; i >= 0; i--) bitsEl.append(h('button', { class: 'bit' + ((v >>> i) & 1 ? ' on' : '') + (marks().includes(i) ? ' mk' : '') + (i % 4 === 3 && i !== w - 1 ? ' gap' : ''), 'aria-label': `bit ${i}`, onclick: () => { v = (v ^ (1 << i)) >>> 0; last = null; refresh(); } }, '' + ((v >>> i) & 1), h('small', {}, '' + i)));
    rd.innerHTML = ''; rd.append(h('span', { class: 'chip on' }, hex(v, w / 4)), h('span', { class: 'chip' }, (v >>> 0) + ' decimal'), h('span', { class: 'chip' }, '0b' + bin(v)));
    eqEl.innerHTML = last ? last.html : `<span class="r">Pick an operation above, or click any bit.</span>\nThe highlighted bit in the lines here will show what the mask touches.`;
  }
  function op(kind) {
    const m = (1 << n) >>> 0; let res = v, html;
    if (kind === 'set') { res = (v | m) >>> 0; html = `reg    = ${sp(bin(v), [n])}\nmask   = ${sp(bin(m), [n])}   (1U << ${n})\n         ${'-'.repeat(w + Math.floor((w - 1) / 4))}\nresult = ${sp(bin(res), [n])}   reg | mask\n\n<span class="r">reg |= (1U &lt;&lt; ${n});   // OR sets the bit</span>`; }
    if (kind === 'clear') { const nm = ((~m) >>> 0) & M(); res = (v & nm) >>> 0; html = `reg    = ${sp(bin(v), [n])}\nmask   = ${sp(bin(nm), [n])}   ~(1U << ${n})\n         ${'-'.repeat(w + Math.floor((w - 1) / 4))}\nresult = ${sp(bin(res), [n])}   reg & mask\n\n<span class="r">reg &amp;= ~(1U &lt;&lt; ${n});   // AND with inverted mask clears</span>`; }
    if (kind === 'toggle') { res = (v ^ m) >>> 0; html = `reg    = ${sp(bin(v), [n])}\nmask   = ${sp(bin(m), [n])}   (1U << ${n})\n         ${'-'.repeat(w + Math.floor((w - 1) / 4))}\nresult = ${sp(bin(res), [n])}   reg ^ mask\n\n<span class="r">reg ^= (1U &lt;&lt; ${n});   // XOR flips the bit</span>`; }
    if (kind === 'check') { const b = (v >>> n) & 1; html = `reg         = ${sp(bin(v), [n])}\nreg >> ${n}     = ${sp(bin(v >>> n), [])}\n& 1U        = ${b}\n\n<span class="r">bit = (reg &gt;&gt; ${n}) &amp; 1U;   // bit ${n} is ${b}</span>`; last = { html, mark: [n] }; return refresh(); }
    v = res & M() >>> 0; v = v >>> 0; last = { html, mark: [n] }; refresh();
  }
  function field() {
    if (pos + len > w || len < 1) { last = { html: `<span class="m">The field must fit: position + length must be at most ${w}.</span>`, mark: [] }; return refresh(); }
    const F = (len === 32 ? 0xFFFFFFFF : ((1 << len) - 1)) >>> 0; const cleared = (v & (~((F << pos) >>> 0))) >>> 0; const ins = (((fv & F) << pos) >>> 0); const res = (cleared | ins) >>> 0 & M();
    const mk = []; for (let i = pos; i < pos + len; i++) mk.push(i);
    last = { mark: mk, html: `reg     = ${sp(bin(v), mk)}\n1) clear = ${sp(bin(cleared & M()), mk)}   reg & ~(${hex(F, 1)}U << ${pos})\n2) value = ${sp(bin(ins & M()), mk)}   (${fv} & ${hex(F, 1)}U) << ${pos}\nresult  = ${sp(bin(res), mk)}   (1) | (2)\n\n<span class="r">reg = (reg &amp; ~(${hex(F, 1)}U &lt;&lt; ${pos})) | ((${fv} &amp; ${hex(F, 1)}U) &lt;&lt; ${pos});</span>` };
    v = res >>> 0; refresh();
  }
  const bn = h('div', { class: 'ctl' }, h('label', {}, 'Bit n', num(n, 0, 31, x => n = Math.max(0, Math.min(x, w - 1)))),
    h('button', { class: 'btn primary', onclick: () => op('set') }, 'Set  |='), h('button', { class: 'btn', onclick: () => op('clear') }, 'Clear  &= ~'), h('button', { class: 'btn', onclick: () => op('toggle') }, 'Toggle  ^='), h('button', { class: 'btn', onclick: () => op('check') }, 'Check  >> &'));
  const fl = h('div', { class: 'ctl' }, h('b', {}, 'Write a field:'), h('label', {}, 'position', num(pos, 0, 31, x => pos = x)), h('label', {}, 'length', num(len, 1, 8, x => len = x)), h('label', {}, 'value', num(fv, 0, 255, x => fv = x)), h('button', { class: 'btn', onclick: field }, 'Insert field'));
  const top = h('div', { class: 'ctl' }, h('label', {}, 'Register width', sel([8, 16, 32], w, x => { w = Number(x); v = (v & M()) >>> 0; n = Math.min(n, w - 1); last = null; refresh(); })),
    h('button', { class: 'btn sm', onclick: () => { v = 0; last = null; refresh(); } }, 'All zero'), h('button', { class: 'btn sm', onclick: () => { v = (Math.random() * 4294967296 >>> 0) & M(); last = null; refresh(); } }, 'Random'));

  refresh();
}

/* ===== 2. MEMORY MAP + STARTUP ===== */
function labMemory(root) {
  const SEG = [
    { id: 'stack', name: 'Stack', where: 'RAM', color: '#F6C9C9', cd: '#5A2A2A', what: 'Local variables, function arguments, return addresses.', ex: 'void f(void) {\n  int x = 5;   // x lives on the stack\n}', life: 'Until the function returns', start: 'Startup sets the stack pointer to the top of RAM (word 0 of the vector table).', grow: 'Grows downward' },

    { id: 'ro', name: '.rodata', where: 'Flash', color: '#E3D3F3', cd: '#43245F', what: 'const data and string literals. Stays in Flash and saves RAM.', ex: 'const uint8_t sine[] = {0, 49, 90};\nchar *s = "hello";', life: 'Whole program', start: 'Nothing to do. It is read straight from Flash.', grow: '' },
    { id: 'text', name: '.text', where: 'Flash', color: '#D9DEE8', cd: '#2A3550', what: 'Your compiled machine code (and the vector table at the very start).', ex: 'int main(void) { ... }', life: 'Whole program', start: 'The CPU fetches instructions from here.', grow: '' }];

  };
  root.append(h('p', { class: 'small muted' }, 'High addresses at the top, low at the bottom. Click a block.'), h('div', { class: 'grid g2' }, left, right), h('div', { class: 'callout' }, '💡 ', h('b', {}, 'Remember: '), 'Text, Data, BSS, Heap, Stack, from bottom to top.'));
  draw();
  /* startup stepper */
  const R = [['f_vec', 'Vector table (SP + handlers)', 'F'], ['f_text', '.text (code)', 'F'], ['f_ro', '.rodata', 'F'], ['f_di', '.data initial values', 'F'], ['r_data', '.data', 'R'], ['r_bss', '.bss', 'R'], ['r_heap', 'heap', 'R'], ['r_stack', 'stack', 'R']];
  const STEPS = [
    { t: 'Reset', d: 'Power on or reset. The CPU looks at the very start of Flash for the vector table.', hl: ['f_vec'] },
    { t: 'Load the stack pointer', d: 'Word 0 of the table is the initial stack pointer, so the CPU sets SP to the top of RAM.', hl: ['f_vec', 'r_stack'] },
    { t: 'Jump to Reset_Handler', d: 'Word 1 is the address of Reset_Handler. The CPU loads it into PC and starts the startup code.', hl: ['f_vec', 'f_text'] },
    { t: 'Copy .data', d: 'Startup code copies the initial values of initialized globals from Flash into RAM.', hl: ['f_di', 'r_data'] },
    { t: 'Zero .bss', d: 'Startup code writes zeros over the whole .bss area, so uninitialized globals start at 0.', hl: ['r_bss'] },
    { t: 'SystemInit and C library init', d: 'Clocks are configured, the heap and C library are set up.', hl: ['f_text', 'r_heap'] },
    { t: 'main()', d: 'Finally your main() runs. Everything above happened before your first line of code.', hl: ['f_text', 'r_stack'] }];
  let si = 0; const sBox = h('div', {}); root.append(h('h3', { style: 'margin-top:22px' }, 'What happens from reset to main()'), sBox);
  const sdraw = () => {

/* ===== 3. STRUCT PADDING ===== */
function labPadding(root) {
  const T = { char: 1, short: 2, int: 4, float: 4, double: 8 };
  const COL = ['#BBD3FF', '#BFEBD0', '#FFE0A8', '#E6CDF5', '#FFC9C9', '#C8EEF0'];
  let mem = [{ t: 'char', n: 'a' }, { t: 'int', n: 'b' }, { t: 'char', n: 'c' }], packed = false, cnt = 3;
  const out = h('div', {}), list = h('div', {});
  function layout() {
    let off = 0, cells = [], maxA = 1;
    mem.forEach((m, k) => { const sz = T[m.t], al = packed ? 1 : sz; maxA = Math.max(maxA, al); while (off % al) { cells.push({ pad: 1 }); off++; } for (let b = 0; b < sz; b++) cells.push({ k, b, first: b === 0 }); off += sz; });
    const A = packed ? 1 : maxA; while (off % A) { cells.push({ pad: 1 }); off++; }
    return { cells, size: off, used: mem.reduce((s, m) => s + T[m.t], 0) };
  }
  function draw() {
    const L = layout(); list.innerHTML = '';
