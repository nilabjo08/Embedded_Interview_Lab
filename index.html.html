<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C and Embedded C Interview Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F9; --grid:rgba(39,72,217,.07); --surface:#FFFFFF; --surface2:#F3F6FB;
  --ink:#13203B; --ink2:#51607D; --line:#D6DFEC;
  --primary:#2748D9; --primary-ink:#FFFFFF; --soft:#E3E9FD;
  --hot:#E8590C; --hot-soft:#FFE8D9; --ok:#0B9E6B; --ok-soft:#D9F5EA;
  --bad:#D63B3B; --bad-soft:#FBE0E0; --warn:#B87D00; --warn-soft:#FFF1CC;
  --code:#0F1B33; --codeink:#E3EAFB; --c1:#8FB2FF; --c2:#7EE0B5; --c3:#FFB86B; --c4:#9CA8C4;
  --shadow:0 1px 0 rgba(19,32,59,.05),0 10px 24px -14px rgba(19,32,59,.28);
  --r:14px;
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"SF Mono",monospace;
}
:root[data-theme=dark]{
  --bg:#0B1220; --grid:rgba(120,150,255,.06); --surface:#121B2F; --surface2:#17223A;
  --ink:#E8EDF8; --ink2:#9DABC8; --line:#25324F;
  --primary:#7A97FF; --primary-ink:#0B1220; --soft:#1C2A55;
  --hot:#FF8A3D; --hot-soft:#3A2415; --ok:#34D399; --ok-soft:#12332A;
  --bad:#FF7A7A; --bad-soft:#3B1B20; --warn:#F5C451; --warn-soft:#3A2F12;
  --code:#0A101E; --codeink:#E3EAFB;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;background-attachment:fixed}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:.55em 0}
a{color:var(--primary)}
code{font-family:var(--mono);font-size:.86em;background:var(--soft);padding:.1em .38em;border-radius:6px}
pre{background:var(--code);color:var(--codeink);padding:14px 16px;border-radius:12px;overflow:auto;font-size:.84rem;line-height:1.55;margin:.8em 0}
pre code{background:none;padding:0;font-size:inherit;color:inherit}
.tk-c{color:var(--c4);font-style:italic}.tk-s{color:var(--c2)}.tk-p{color:var(--c3)}.tk-n{color:var(--c3)}.tk-k{color:var(--c1);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:.8em 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--soft)}
td code{white-space:pre-wrap;word-break:break-word}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}

/* layout */
.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:800;font-size:1.15rem;padding:2px 8px 14px;cursor:pointer}
.brand i{font-style:normal;background:var(--primary);color:var(--primary-ink);border-radius:9px;padding:2px 8px;font-family:var(--mono);font-size:.95rem}
.nav-h{font-weight:700;font-size:.82rem;color:var(--ink2);margin:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.97rem}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--soft);font-weight:700}
.nav .em{width:1.4em;text-align:center}
.nav .sub{margin-left:auto;font-size:.78rem;color:var(--ink2);font-family:var(--mono)}
.ring{--p:0;width:22px;height:22px;border-radius:50%;margin-left:auto;flex:none;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.nav a.on .ring::after{background:var(--soft)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:12px 22px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;font:inherit;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search::before{content:"🔎";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.95rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;cursor:pointer}
.iconbtn:hover{background:var(--surface2)}
#menu{display:none}
.pill{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink2)}
#view{padding:26px 22px 80px;max-width:1040px;margin:0 auto}

/* buttons / chips */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:700;transition:transform .12s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--primary)}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}.btn.ok:hover{background:var(--ok);filter:brightness(1.07)}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}.btn.bad:hover{background:var(--bad)}
.btn.sm{padding:5px 11px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* home hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center;margin-bottom:26px}
.hero p.lead{font-size:1.1rem;color:var(--ink2);max-width:34ch}
.reg{background:var(--code);color:var(--codeink);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.reg .leds{display:flex;gap:7px;justify-content:space-between}
.bitbtn{flex:1;min-width:0;border:2px solid #2A3A63;background:#14203C;border-radius:12px;padding:8px 0 6px;cursor:pointer;color:#7D8DB6;
  font-family:var(--mono);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s}
.bitbtn b{font-size:1.25rem}
.bitbtn small{font-size:.68rem;opacity:.8}
.bitbtn.on{background:#FFB020;border-color:#FFD27A;color:#2A1B00;box-shadow:0 0 20px rgba(255,176,32,.55)}
.bitbtn.hl{outline:2px dashed #8FB2FF;outline-offset:2px}
.reg .out{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-family:var(--mono);font-size:.9rem}
.reg .out span{background:#14203C;border-radius:8px;padding:3px 9px}
.reg .codeline{margin-top:12px;font-family:var(--mono);font-size:.92rem;color:#BFD0FF;min-height:1.5em}
.cardlink{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s}
.cardlink:hover{transform:translateY(-2px);border-color:var(--primary)}
.cardlink h3{margin-bottom:.25em}
.cardlink .big{font-size:1.7rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--ok));border-radius:99px;transition:width .4s}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border:0}
.todo input{margin-top:6px;width:18px;height:18px;accent-color:var(--ok)}
.todo.done span{text-decoration:line-through;color:var(--ink2)}

/* learn cards */
.phead{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.phead .em{font-size:2.4rem}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
.qcard.learned{border-left:5px solid var(--ok)}
.qhead{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;text-align:left;border:0;background:none}
.qhead:hover{background:var(--surface2)}
.qid{font-family:var(--mono);font-size:.8rem;background:var(--soft);color:var(--primary);padding:2px 8px;border-radius:8px;flex:none;font-weight:700}
.qtitle{flex:1;font-weight:700;font-family:var(--display);font-size:1.04rem;line-height:1.3}
.flame{font-size:.8rem;background:var(--hot-soft);color:var(--hot);padding:2px 8px;border-radius:99px;font-weight:700;flex:none}
.chev{transition:transform .25s;flex:none;color:var(--ink2)}
.qcard.open .chev{transform:rotate(90deg)}
.qwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.qcard.open .qwrap{grid-template-rows:1fr}
.qwrap>div{overflow:hidden}
.qbody{padding:2px 20px 18px;border-top:1px dashed var(--line)}
.hook{display:flex;gap:10px;background:var(--warn-soft);border-left:5px solid #F2B600;border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:700}
.qact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.star.on{background:var(--warn-soft);border-color:#F2B600}
.lrn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* flashcards */
.fc-wrap{perspective:1400px;max-width:720px;margin:18px auto}
.fc{position:relative;height:min(460px,64vh);transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:26px;overflow:auto}
.fc .front{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.fc .front h2{font-size:1.6rem}
.fc .back{transform:rotateY(180deg);background:var(--surface2)}
.fc .back .body{font-size:.96rem}

/* quiz */
.qz-opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;margin:9px 0;cursor:pointer;font-size:1rem;transition:border-color .15s,background .15s}
.qz-opt:hover:not([disabled]){border-color:var(--primary);background:var(--soft)}
.qz-opt.right{border-color:var(--ok);background:var(--ok-soft)}
.qz-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qz-opt[disabled]{cursor:default}
.explain{border-left:5px solid var(--primary);background:var(--soft);padding:10px 14px;border-radius:10px;margin-top:12px}
.streak{font-weight:800;color:var(--hot)}
.big-score{font-family:var(--display);font-size:3.4rem;font-weight:800}

/* mock */
textarea.say{width:100%;min-height:120px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--ink);resize:vertical}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}
.timer>i{display:block;height:100%;background:var(--hot);width:100%;transition:width 1s linear}
.interviewer{display:flex;gap:12px;align-items:flex-start}
.avatar{font-size:2rem;flex:none}
.bubble{background:var(--soft);border-radius:4px 16px 16px 16px;padding:12px 16px;font-weight:700;font-family:var(--display);font-size:1.12rem}

/* labs */
.labbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.labbar .chip{display:flex;gap:6px;align-items:center}
.lab h2{margin-bottom:.2em}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}
.ctl label{display:flex;gap:6px;align-items:center;font-weight:700;font-size:.92rem}
.ctl input[type=number],.ctl input[type=text],.ctl select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);max-width:150px}
.ctl input[type=range]{accent-color:var(--primary)}
.bits{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bit{width:40px;border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:5px 0 3px;cursor:pointer;text-align:center;font-family:var(--mono);font-weight:700}
.bit small{display:block;font-size:.68rem;color:var(--ink2);font-weight:400}
.bit.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.bit.on small{color:inherit;opacity:.8}
.bit.mk{outline:3px dashed var(--hot);outline-offset:1px}
.bit.gap{margin-left:12px}
.mono{font-family:var(--mono)}
.eq{margin:10px 0;font-family:var(--mono);background:var(--code);color:var(--codeink);border-radius:12px;padding:12px 16px;overflow:auto;white-space:pre;font-size:.9rem;line-height:1.7}
.eq .m{color:var(--c3)}.eq .r{color:var(--c2)}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.cell{width:46px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:.78rem;position:relative}
.cell small{font-size:.6rem;color:var(--ink2)}
.cell.pad{background:repeating-linear-gradient(45deg,var(--bad-soft),var(--bad-soft) 5px,transparent 5px,transparent 10px);border-color:var(--bad);color:var(--bad)}
.cell.mark{outline:3px solid var(--primary)}
.stack{display:flex;flex-direction:column;gap:0;border-radius:14px;overflow:hidden;border:2px solid var(--ink)}
.seg{padding:12px 16px;cursor:pointer;border-bottom:2px solid var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;transition:filter .15s}
.seg:last-child{border-bottom:0}
.seg:hover{filter:brightness(.96)}
.seg.on{outline:4px solid var(--primary);outline-offset:-4px}
.seg b{font-family:var(--mono)}
.seg span{font-size:.85rem}
.tag{font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--ink);color:var(--bg)}
.step-dots{display:flex;gap:6px;margin:10px 0}
.step-dots i{flex:1;height:7px;border-radius:99px;background:var(--line);transition:background .2s}
.step-dots i.on{background:var(--primary)}
.box{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);transition:all .25s}
.box.hl{border-color:var(--primary);background:var(--soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent)}
.box h4{margin:0 0 4px;font-family:var(--display)}
.slot{border:1px dashed var(--line);border-radius:8px;padding:3px 8px;font-family:var(--mono);font-size:.82rem;margin:3px 0;color:var(--ink2);transition:all .25s}
.slot.f{background:var(--warn-soft);border:1px solid #F2B600;color:var(--ink)}
.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;overflow:auto}
.svgbox svg{display:block;max-width:100%;height:auto}
.led{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:-2px}
.led.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.led.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.ringbuf{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.slotc{width:58px;height:58px;border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;position:relative;background:var(--surface2)}
.slotc.f{background:var(--soft);border-color:var(--primary)}
.slotc em{position:absolute;bottom:-20px;font-size:.72rem;font-style:normal;font-weight:700}
.slotc .hd{color:var(--ok)}.slotc .tl{color:var(--hot)}
.callout{background:var(--soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.bigmsg{font-weight:800;font-size:1.05rem}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:70;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:50;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  #menu{display:inline-block}
  .hero{grid-template-columns:1fr}
  #view{padding:20px 14px 70px}
  .pill{display:none}
}
@media(max-width:520px){.bits{gap:4px}.bit{width:30px}.bit.gap{margin-left:8px}.cell{width:40px;height:40px}.bitbtn b{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.fc{transition:none}}


.ed{width:100%;min-height:240px;background:var(--code);color:var(--codeink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:.86rem;line-height:1.55;tab-size:2;resize:vertical}
.qbody h4{font-family:var(--display);font-size:.98rem;margin:1em 0 .2em;color:var(--primary)}
@media(max-width:700px){.ed{font-size:.8rem}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand" id="brand"><i>C</i> Interview Lab</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top">
      <button class="iconbtn" id="menu" aria-label="Open menu">☰</button>
      <div class="search"><input id="search" type="search" placeholder="Search any question or topic (try: volatile, I2C, padding)" aria-label="Search questions"></div>
      <div class="pill"><span id="pillTxt"></span></div>
      <button class="iconbtn" id="theme" aria-label="Switch light or dark theme">🌓</button>
    </div>
    <main id="view"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = {"parts": [{"id": "A", "title": "C Fundamentals", "short": "C core", "icon": "🧱", "blurb": "The C questions asked in almost every interview", "questions": [{"id": "A1", "title": "What are the sizes of the basic data types? Why do embedded engineers use stdint.h?", "html": "<table>\n<thead>\n<tr class=\"header\">\n<th>Type<\/th>\n<th>8/16-bit MCU<\/th>\n<th>32-bit ARM<\/th>\n<th>64-bit PC<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>char<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>short<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>int<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>long<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<td>4 (Windows) or 8 (Linux)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>long long<\/td>\n<td>8<\/td>\n<td>8<\/td>\n<td>8<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>float<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>double<\/td>\n<td>8 (or 4 on some)<\/td>\n<td>8<\/td>\n<td>8<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>pointer<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Logic:<\/strong> The C standard only guarantees minimum sizes.\n<code>int<\/code> means “the natural word size of the machine”, so code\nusing <code>int<\/code> can break when you move to another chip. Types\nlike <code>uint8_t<\/code>, <code>int16_t<\/code>, <code>uint32_t<\/code>\nfrom <code>&lt;stdint.h&gt;<\/code> have exact sizes everywhere. This\nmatters when you map registers, build communication packets, or store\ndata in flash.<\/p>\n", "hook": "int is a guess, uint32_t is a promise.", "hot": true, "lab": ""}, {"id": "A2", "title": "What does `static` do?", "html": "<ol type=\"1\">\n<li><strong>Static local variable:<\/strong> keeps its value between\nfunction calls. Lifetime is the whole program, scope is only inside the\nfunction.<\/li>\n<li><strong>Static global variable or function:<\/strong> visible only\ninside that <code>.c<\/code> file (internal linkage). This gives you\n“private” data and avoids name clashes between files.<\/li>\n<\/ol>\n<p><strong>Logic:<\/strong> Normal local variables live on the stack and\nare destroyed when the function returns. Static locals live in\n<code>.data<\/code> (if initialized) or <code>.bss<\/code> (if zero), so\nthey survive. Static globals are hidden from the linker.<\/p>\n<pre class=\"c\"><code>int counter(void)\n{\n    static int c = 0;   // initialized once, before main\n    return ++c;         // 1, 2, 3, ...\n}<\/code><\/pre>\n", "hook": "static = stays alive, stays private.", "hot": true, "lab": ""}, {"id": "A3", "title": "What is `volatile`? Why is it critical in embedded?", "html": "<p><code>volatile<\/code> tells the compiler: “this value can change\noutside the normal program flow, so never cache it in a register and\nnever optimize away its reads or writes.”<\/p>\n<p>Three classic uses:<\/p>\n<ol type=\"1\">\n<li>Memory-mapped hardware registers<\/li>\n<li>Variables shared between an ISR and main code<\/li>\n<li>Variables shared between threads (volatile alone is not enough for\nthread safety)<\/li>\n<\/ol>\n<pre class=\"c\"><code>volatile uint8_t flag = 0;   // set inside an ISR\nwhile (flag == 0) { }        // without volatile, the compiler may read flag once and loop forever<\/code><\/pre>\n<p><strong>Logic:<\/strong> With optimization on, the compiler sees\nnothing in the loop that changes <code>flag<\/code>, so it loads it once\ninto a register and loops forever. <code>volatile<\/code> forces a fresh\nread from memory every time.<\/p>\n<p><strong>Follow-ups interviewers love:<\/strong><\/p>\n<ul>\n<li><em>Can a variable be <code>const volatile<\/code>?<\/em> Yes. It\nmeans “my code must not write it, but hardware can change it”, for\nexample a read-only status register.<\/li>\n<li><em>Can a pointer be volatile?<\/em> Yes.\n<code>volatile int *p<\/code> is a pointer to volatile data.\n<code>int *volatile p<\/code> is a volatile pointer.<\/li>\n<li><em>Does volatile make access atomic?<\/em> No. It only stops\ncompiler optimization. A 32-bit read on an 8-bit MCU can still be\ninterrupted halfway.<\/li>\n<li><em>Does volatile give memory ordering between CPUs/cache?<\/em>\nNo.<\/li>\n<\/ul>\n", "hook": "Hardware or ISR can change it behind my back.", "hot": true, "lab": "volatile"}, {"id": "A4", "title": "Explain `const int *p`, `int *const p` and `const int *const p`.", "html": "<p><strong>Rule: read right to left.<\/strong><\/p>\n<ul>\n<li><code>const int *p<\/code>: p is a pointer to a const int. You cannot\nchange the data through p, but p can point elsewhere.<\/li>\n<li><code>int *const p<\/code>: p is a const pointer to an int. p is\nfixed, but the data can change.<\/li>\n<li><code>const int *const p<\/code>: neither can change.<\/li>\n<\/ul>\n<p><strong>Embedded use:<\/strong> <code>const uint8_t table[]<\/code>\nplaces the table in flash instead of RAM, saving precious RAM.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "A5", "title": "Array vs pointer: what is the difference?", "html": "<ul>\n<li><code>sizeof(arr)<\/code> gives total bytes of the array.\n<code>sizeof(ptr)<\/code> gives the pointer size.<\/li>\n<li>An array name is not a modifiable variable (<code>arr++<\/code> is\nillegal). A pointer can be reassigned.<\/li>\n<li>In expressions the array name decays to a pointer to its first\nelement (except with <code>sizeof<\/code> and <code>&amp;<\/code>).<\/li>\n<li>When passed to a function, <code>int a[]<\/code> is really\n<code>int *a<\/code>, so the size is lost. Always pass the length as\nanother parameter.<\/li>\n<\/ul>\n", "hook": "", "hot": true, "lab": "pointer"}, {"id": "A6", "title": "How does pointer arithmetic work?", "html": "<p><code>p + 1<\/code> moves by <code>sizeof(*p)<\/code> bytes, not by 1\nbyte. For <code>int *p<\/code> at address 1000 on a 32-bit system,\n<code>p + 1<\/code> is 1004.<\/p>\n<p>Also <code>arr[i]<\/code> is exactly <code>*(arr + i)<\/code>, which is\nwhy <code>i[arr]<\/code> is legal too.<\/p>\n<p><strong>Logic:<\/strong> The compiler knows the type being pointed to,\nso it scales the step for you. That is why pointer type matters.<\/p>\n", "hook": "", "hot": false, "lab": "pointer"}, {"id": "A7", "title": "What is a `void *`?", "html": "<p>A generic pointer that can hold the address of any data type. You\ncannot dereference it or do arithmetic on it without casting first (GCC\nallows arithmetic as an extension). <code>malloc<\/code> returns\n<code>void *<\/code>, and <code>memcpy<\/code> takes <code>void *<\/code>\nso it works on any type.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "A8", "title": "What are null, dangling and wild pointers?", "html": "<ul>\n<li><strong>Null pointer:<\/strong> points to nothing\n(<code>NULL<\/code>). Dereferencing it is undefined behavior.<\/li>\n<li><strong>Dangling pointer:<\/strong> points to memory that was freed\nor went out of scope. Fix: set the pointer to <code>NULL<\/code> after\n<code>free<\/code>, and never return the address of a local\nvariable.<\/li>\n<li><strong>Wild pointer:<\/strong> uninitialized, so it holds a garbage\naddress. Fix: always initialize pointers (to <code>NULL<\/code> if\nnothing else).<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "A9", "title": "malloc vs calloc vs realloc vs free. What is a memory leak?", "html": "<ul>\n<li><code>malloc(n)<\/code> allocates n bytes, uninitialized.<\/li>\n<li><code>calloc(count, size)<\/code> allocates and zeroes the\nmemory.<\/li>\n<li><code>realloc(p, n)<\/code> resizes a block and may move it. Always\nassign the result to a temporary pointer first, otherwise a failure\nloses the original block.<\/li>\n<li><code>free(p)<\/code> releases the block.<\/li>\n<li><strong>Memory leak:<\/strong> allocating without freeing, so the\nheap slowly runs out. Related bugs: double free and use-after-free.<\/li>\n<\/ul>\n<p>Always check the return value of <code>malloc<\/code> for\n<code>NULL<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "A10", "title": "Explain the memory layout of a C program. (asked almost every time)", "html": "<pre><code>High address  +-----------------+\n              | Stack (grows down) | locals, return addresses, arguments\n              |       ...       |\n              | Heap (grows up)    | malloc / free\n              +-----------------+\n              | .bss            | uninitialized / zero-initialized globals and statics\n              | .data           | initialized globals and statics\n              | .rodata         | const data, string literals\nLow address   | .text           | machine code\n              +-----------------+<\/code><\/pre>\n<p><strong>Embedded twist:<\/strong><\/p>\n<ul>\n<li><code>.text<\/code> and <code>.rodata<\/code> live in Flash.<\/li>\n<li><code>.data<\/code> has its initial values stored in Flash and is\ncopied to RAM at startup.<\/li>\n<li><code>.bss<\/code> is zeroed in RAM at startup.<\/li>\n<li>Stack and heap are in RAM.<\/li>\n<li>The startup code does all this before <code>main()<\/code>.<\/li>\n<\/ul>\n", "hook": "Text, Data, BSS, Heap, Stack: bottom to top.", "hot": true, "lab": "memory"}, {"id": "A11", "title": "`char *s = \"hello\"` vs `char s[] = \"hello\"`?", "html": "<ul>\n<li><code>char *s = \"hello\"<\/code>: s points to a string literal in\nread-only memory. Modifying it is undefined behavior (crash on many\nsystems).<\/li>\n<li><code>char s[] = \"hello\"<\/code>: a modifiable copy of the string in\nan array (on the stack if local).<\/li>\n<\/ul>\n<p>Better practice: <code>const char *s = \"hello\";<\/code> so the\ncompiler stops you from modifying it.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "A12", "title": "What is structure padding? How do you reduce it?", "html": "<p>The compiler inserts unused bytes so every member sits at an address\nthat is a multiple of its size (alignment). This makes CPU access fast\nand avoids alignment faults.<\/p>\n<pre class=\"c\"><code>struct A { char a; int b; char c; };  // 12 bytes: a(1)+3 pad, b(4), c(1)+3 pad\nstruct B { int b; char a; char c; };  // 8 bytes: b(4), a(1), c(1), +2 pad<\/code><\/pre>\n<p><strong>Fixes:<\/strong> order members from largest to smallest, or\nuse <code>__attribute__((packed))<\/code>. Packing saves space but can\ncause slower or unaligned access (a fault on some cores), so do not use\nit casually.<\/p>\n<p><strong>Logic:<\/strong> The total struct size is also rounded up to a\nmultiple of its largest member, so arrays of structs stay aligned.<\/p>\n", "hook": "", "hot": true, "lab": "padding"}, {"id": "A13", "title": "Structure vs union?", "html": "<p>A structure allocates separate memory for each member (size at least\nthe sum of members). A union shares one memory block (size equals the\nlargest member), and only one member is valid at a time.<\/p>\n<p><strong>Embedded use:<\/strong> view a 32-bit register as four bytes\nor as bit-fields, or save RAM when only one of several message types is\nactive at a time.<\/p>\n<pre class=\"c\"><code>union { uint32_t word; uint8_t bytes[4]; } u;<\/code><\/pre>\n", "hook": "", "hot": true, "lab": ""}, {"id": "A14", "title": "What are bit-fields and why are they risky for registers?", "html": "<pre class=\"c\"><code>struct { unsigned en:1; unsigned mode:3; unsigned :4; } ctrl;<\/code><\/pre>\n<p>Bit order, packing and padding are implementation-defined, so the\nlayout can differ between compilers. For portable hardware register\ncode, use masks and shifts instead.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "A15", "title": "Macro vs inline function vs normal function?", "html": "<table>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Macro<\/th>\n<th>Inline function<\/th>\n<th>Normal function<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Handled by<\/td>\n<td>Preprocessor (text replace)<\/td>\n<td>Compiler<\/td>\n<td>Compiler<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Type checking<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Call overhead<\/td>\n<td>None<\/td>\n<td>Usually none<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Debuggable<\/td>\n<td>Hard<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Classic trap:<\/strong><\/p>\n<pre class=\"c\"><code>#define SQUARE(x) x*x\nSQUARE(2+3)                    // becomes 2+3*2+3 = 11, not 25\n#define SQUARE(x) ((x)*(x))    // safer version<\/code><\/pre>\n<p>Even the safe version breaks on <code>SQUARE(i++)<\/code> because\n<code>i++<\/code> is evaluated twice. This is why inline functions are\npreferred.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "A16", "title": "What is undefined behavior? Give examples.", "html": "<p>The standard places no requirements on what happens. It might work,\ncrash, or silently corrupt data, and it may change when you change the\noptimization level.<\/p>\n<p>Examples:<\/p>\n<ul>\n<li>Dereferencing a null or dangling pointer<\/li>\n<li>Array out-of-bounds access<\/li>\n<li>Signed integer overflow<\/li>\n<li>Reading an uninitialized variable<\/li>\n<li><code>i = i++ + ++i;<\/code> (modifying a variable twice without a\nsequence point)<\/li>\n<li>Shifting by a negative amount or by more than the type width<\/li>\n<\/ul>\n<p>Note that <strong>unsigned<\/strong> overflow is well defined and\nwraps around.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "A17", "title": "memcpy vs memmove? strlen vs sizeof?", "html": "<ul>\n<li><code>memcpy<\/code> is undefined if source and destination overlap.\n<code>memmove<\/code> handles overlap correctly (it copies backward when\nneeded).<\/li>\n<li><code>sizeof<\/code> is a compile-time operator giving bytes of the\ntype or array, including the <code>'\\0'<\/code>. <code>strlen<\/code> is a\nrun-time function counting characters until <code>'\\0'<\/code>.<\/li>\n<\/ul>\n<pre class=\"c\"><code>char s[] = &quot;abc&quot;;   // sizeof(s) = 4, strlen(s) = 3<\/code><\/pre>\n", "hook": "", "hot": true, "lab": ""}, {"id": "A18", "title": "What is a function pointer? Where is it used?", "html": "<pre class=\"c\"><code>int add(int a, int b) { return a + b; }\nint (*fp)(int, int) = add;\nint r = fp(2, 3);          // 5<\/code><\/pre>\n<p><strong>Uses:<\/strong> callbacks, interrupt vector tables, state\nmachines, driver abstraction (<code>ops-&gt;read()<\/code>), and\n<code>qsort<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "A19", "title": "What are the storage classes?", "html": "<ul>\n<li><code>auto<\/code>: the default for locals (stack).<\/li>\n<li><code>register<\/code>: a hint to keep the variable in a CPU register\n(you cannot take its address).<\/li>\n<li><code>static<\/code>: see A2.<\/li>\n<li><code>extern<\/code>: declares a variable or function defined\nelsewhere.<\/li>\n<\/ul>\n<p><strong>Declaration<\/strong> says “it exists” (no memory allocated).\n<strong>Definition<\/strong> allocates memory. A variable can be declared\nmany times but defined only once.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "A20", "title": "What is endianness? How do you check it?", "html": "<ul>\n<li><strong>Little-endian:<\/strong> the least significant byte is stored\nat the lowest address (x86, ARM Cortex-M).<\/li>\n<li><strong>Big-endian:<\/strong> the most significant byte is stored at\nthe lowest address (network byte order).<\/li>\n<\/ul>\n<pre class=\"c\"><code>uint16_t x = 0x0001;\nif (*(uint8_t *)&amp;x == 1) puts(&quot;Little endian&quot;);<\/code><\/pre>\n", "hook": "", "hot": true, "lab": "endian"}, {"id": "A21", "title": "Why do we use `#ifndef` header guards?", "html": "<p>They stop the same header from being included twice in one\ntranslation unit, which would cause redefinition errors.<\/p>\n<pre class=\"c\"><code>#ifndef MY_H\n#define MY_H\n/* declarations */\n#endif<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "A22", "title": "What are integer promotion and the signed/unsigned trap?", "html": "<p>Smaller types (<code>char<\/code>, <code>short<\/code>) are promoted to\n<code>int<\/code> in expressions. When you mix signed and unsigned of the\nsame rank, the signed value is converted to unsigned.<\/p>\n<pre class=\"c\"><code>int s = -1; unsigned u = 1;\nif (s &lt; u) { }   // FALSE: -1 becomes 4294967295<\/code><\/pre>\n", "hook": "Never compare signed with unsigned.", "hot": true, "lab": "wrap"}]}, {"id": "B", "title": "More C Fundamentals", "short": "C deep dive", "icon": "🔍", "blurb": "Preprocessor, strings, arrays, pointers and classic traps", "questions": [{"id": "B1", "title": "What are the stages of compilation? (very common)", "html": "<ol type=\"1\">\n<li><strong>Preprocessing:<\/strong> handles <code>#include<\/code>,\n<code>#define<\/code>, <code>#ifdef<\/code>; removes comments. Output:\nexpanded source (<code>.i<\/code>).<\/li>\n<li><strong>Compilation:<\/strong> turns C into assembly\n(<code>.s<\/code>) and checks syntax and types.<\/li>\n<li><strong>Assembly:<\/strong> turns assembly into machine code in an\nobject file (<code>.o<\/code>).<\/li>\n<li><strong>Linking:<\/strong> combines object files and libraries,\nresolves symbols (function and variable addresses), and places sections\nusing the linker script. Output: executable (<code>.elf<\/code>).<\/li>\n<\/ol>\n<p>For embedded, one more step: <code>objcopy<\/code> converts the ELF to\n<code>.bin<\/code> or <code>.hex<\/code>, which is flashed to the MCU.<\/p>\n<p><strong>Follow-up:<\/strong> <em>“Undefined reference” error comes\nfrom which stage?<\/em> The linker (function declared but never defined\nor not linked in). <em>“Syntax error”<\/em> comes from the compiler.<\/p>\n", "hook": "Pre-Compile-Assemble-Link: P, C, A, L.", "hot": true, "lab": ""}, {"id": "B2", "title": "What is the difference between `#define`, `const` and `enum`?", "html": "<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th><code>#define<\/code><\/th>\n<th><code>const<\/code><\/th>\n<th><code>enum<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Who handles it<\/td>\n<td>Preprocessor<\/td>\n<td>Compiler<\/td>\n<td>Compiler<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Type<\/td>\n<td>None<\/td>\n<td>Has a type<\/td>\n<td>int constants<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Memory<\/td>\n<td>No<\/td>\n<td>Usually yes (may be optimized away)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Scope<\/td>\n<td>From the define to end of file<\/td>\n<td>Normal C scope<\/td>\n<td>Normal C scope<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Debugger shows name<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Use as array size<\/td>\n<td>Yes<\/td>\n<td>Not in C89 (not a true constant expression)<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Logic:<\/strong> <code>#define<\/code> is blind text\nreplacement. <code>const<\/code> and <code>enum<\/code> are understood by\nthe compiler, so they are safer. Use <code>enum<\/code> for related named\ninteger constants (states, error codes).<\/p>\n<pre class=\"c\"><code>typedef enum { IDLE, RUNNING, ERROR } state_t;   // IDLE=0, RUNNING=1, ERROR=2<\/code><\/pre>\n", "hook": "", "hot": true, "lab": ""}, {"id": "B3", "title": "`typedef` vs `#define`?", "html": "<p><code>typedef<\/code> creates a real type alias handled by the\ncompiler. <code>#define<\/code> is text replacement and can surprise you\nwith pointers.<\/p>\n<pre class=\"c\"><code>#define PINT int*\nPINT a, b;        // int *a, b;  -&gt; b is a plain int!\n\ntypedef int* PINTT;\nPINTT c, d;       // both c and d are int pointers<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B4", "title": "What is `extern`? Where do declarations and definitions go?", "html": "<p><code>extern int x;<\/code> means “x is defined in some other file”.\nPut <strong>declarations<\/strong> in the header (<code>.h<\/code>) and\n<strong>definitions<\/strong> in one <code>.c<\/code> file.<\/p>\n<pre class=\"c\"><code>/* config.h */  extern int g_count;     // declaration\n/* config.c */  int g_count = 0;        // definition (memory allocated here)<\/code><\/pre>\n<p>If you put a definition in a header and include it in two files, the\nlinker reports “multiple definition”.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B5", "title": "What are internal and external linkage?", "html": "<ul>\n<li><strong>External linkage:<\/strong> the name is visible to other\nfiles (the default for global variables and functions).<\/li>\n<li><strong>Internal linkage:<\/strong> the name is visible only in its\nown file (<code>static<\/code> at file scope).<\/li>\n<li><strong>No linkage:<\/strong> local variables.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B6", "title": "Scope vs lifetime: what is the difference?", "html": "<ul>\n<li><strong>Scope:<\/strong> where in the code a name can be used.<\/li>\n<li><strong>Lifetime:<\/strong> how long the memory exists.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Variable<\/th>\n<th>Scope<\/th>\n<th>Lifetime<\/th>\n<th>Stored in<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Local<\/td>\n<td>Inside block<\/td>\n<td>Until function returns<\/td>\n<td>Stack<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Static local<\/td>\n<td>Inside function<\/td>\n<td>Whole program<\/td>\n<td>.data / .bss<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Global<\/td>\n<td>Whole program (via extern)<\/td>\n<td>Whole program<\/td>\n<td>.data / .bss<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Static global<\/td>\n<td>That file<\/td>\n<td>Whole program<\/td>\n<td>.data / .bss<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>malloc memory<\/td>\n<td>Wherever pointer is<\/td>\n<td>Until free<\/td>\n<td>Heap<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B7", "title": "Stack vs heap?", "html": "<table>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Stack<\/th>\n<th>Heap<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Managed by<\/td>\n<td>Compiler (automatic)<\/td>\n<td>Programmer (malloc/free)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Speed<\/td>\n<td>Very fast<\/td>\n<td>Slower<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Size<\/td>\n<td>Small, fixed<\/td>\n<td>Larger, flexible<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lifetime<\/td>\n<td>Function call<\/td>\n<td>Until freed<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Problems<\/td>\n<td>Stack overflow<\/td>\n<td>Leaks, fragmentation<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Allocation order<\/td>\n<td>LIFO<\/td>\n<td>Any order<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "hook": "", "hot": true, "lab": ""}, {"id": "B8", "title": "What happens during a function call?", "html": "<ol type=\"1\">\n<li>Arguments are placed in registers (on ARM, the first four go in R0\nto R3) or pushed onto the stack.<\/li>\n<li>The return address is saved (ARM: in the Link Register LR; x86:\npushed on the stack).<\/li>\n<li>A <strong>stack frame<\/strong> is created for local variables and\nsaved registers.<\/li>\n<li>On return, the frame is released and execution jumps back to the\nsaved address.<\/li>\n<\/ol>\n<p><strong>Why it matters:<\/strong> every call uses stack. Deep\nrecursion or big local arrays overflow the stack. On a microcontroller\nthere is usually no MMU, so a stack overflow silently corrupts other\ndata or triggers a hard fault.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "B9", "title": "What is recursion? Why is it avoided in embedded?", "html": "<p>A function that calls itself. Each call uses a new stack frame, so\nthe stack depth depends on input and can overflow. Worst-case stack\nusage cannot be predicted, which is why safety standards like MISRA\ndiscourage or ban recursion. Use loops instead.<\/p>\n<pre class=\"c\"><code>int fact(int n) { return (n &lt;= 1) ? 1 : n * fact(n - 1); }   // needs a base case<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B10", "title": "Does C have pass by reference?", "html": "<p>No. C is always <strong>pass by value<\/strong>. To let a function\nmodify the caller’s variable, pass its address (a pointer). The pointer\nitself is still copied by value.<\/p>\n<pre class=\"c\"><code>void inc(int *p) { (*p)++; }\nint x = 5; inc(&amp;x);   // x = 6<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B11", "title": "What is the difference between `++i` and `i++`?", "html": "<ul>\n<li><code>++i<\/code> (pre-increment): increment first, then use the new\nvalue.<\/li>\n<li><code>i++<\/code> (post-increment): use the old value, then\nincrement.<\/li>\n<\/ul>\n<pre class=\"c\"><code>int i = 5;\nint a = i++;   // a = 5, i = 6\nint b = ++i;   // i = 7, b = 7<\/code><\/pre>\n<p>As a standalone statement (<code>i++;<\/code>) they behave the\nsame.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B12", "title": "What do `*p++`, `(*p)++`, `*++p` and `++*p` mean?", "html": "<p>Postfix <code>++<\/code> has higher precedence than\n<code>*<\/code>.<\/p>\n<ul>\n<li><code>*p++<\/code> : use the value at p, then move the pointer.\n(<code>*(p++)<\/code>)<\/li>\n<li><code>(*p)++<\/code> : increment the data p points to.<\/li>\n<li><code>*++p<\/code> : move the pointer first, then read.<\/li>\n<li><code>++*p<\/code> : increment the data and use the new value.<\/li>\n<\/ul>\n", "hook": "Parentheses decide whether the pointer or the data changes.", "hot": false, "lab": ""}, {"id": "B13", "title": "Operator precedence traps (very common in embedded)", "html": "<pre class=\"c\"><code>if (reg &amp; MASK == MASK)     // WRONG: == is higher than &amp;, so it is reg &amp; (MASK == MASK)\nif ((reg &amp; MASK) == MASK)   // correct<\/code><\/pre>\n<p>Other traps:<\/p>\n<ul>\n<li><code>a = b == c<\/code> assigns the result of the comparison.<\/li>\n<li><code>x &lt;&lt; 1 + 2<\/code> shifts by 3, because <code>+<\/code> is\nhigher than <code>&lt;&lt;<\/code>.<\/li>\n<li><code>*p.x<\/code> means <code>*(p.x)<\/code>, not\n<code>(*p).x<\/code>. Use <code>p-&gt;x<\/code>.<\/li>\n<\/ul>\n<p><strong>Rule:<\/strong> when in doubt, add parentheses. Interviewers\nlike this answer.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "B14", "title": "`&` vs `&&`, `|` vs `||`", "html": "<ul>\n<li><code>&amp;<\/code> and <code>|<\/code> are <strong>bitwise<\/strong>:\nthey work bit by bit. <code>5 &amp; 2 = 0<\/code>.<\/li>\n<li><code>&amp;&amp;<\/code> and <code>||<\/code> are\n<strong>logical<\/strong>: they give 0 or 1.\n<code>5 &amp;&amp; 2 = 1<\/code>.<\/li>\n<li>Logical operators <strong>short-circuit<\/strong>:\n<code>a &amp;&amp; b<\/code> does not evaluate b if a is false. This\nallows <code>if (p != NULL &amp;&amp; p-&gt;x &gt; 0)<\/code>\nsafely.<\/li>\n<li>Trap: <code>if (x &gt; 0 || y++)<\/code> does not execute\n<code>y++<\/code> when <code>x &gt; 0<\/code>.<\/li>\n<\/ul>\n", "hook": "", "hot": true, "lab": ""}, {"id": "B15", "title": "What are right shift and left shift rules?", "html": "<ul>\n<li><code>x &lt;&lt; n<\/code> is multiply by\n2^n. <code>x &gt;&gt; n<\/code> is divide by 2^n (for unsigned).<\/li>\n<li>Right shift of a <strong>negative signed<\/strong> number is\nimplementation-defined (usually arithmetic shift, keeps sign).<\/li>\n<li>Shifting by a negative number or by the type width or more is\nundefined behavior.<\/li>\n<li>Left shifting into the sign bit of a signed int\n(<code>1 &lt;&lt; 31<\/code>) is undefined. Use\n<code>1U &lt;&lt; 31<\/code>.<\/li>\n<\/ul>\n", "hook": "Use unsigned types for bit operations.", "hot": false, "lab": "wrap"}, {"id": "B16", "title": "`NULL`, `'\\0'`, `0` and `\"0\"`: what is the difference?", "html": "<ul>\n<li><code>NULL<\/code>: null pointer constant (like\n<code>(void *)0<\/code>).<\/li>\n<li><code>'\\0'<\/code>: the character with value 0, the string\nterminator.<\/li>\n<li><code>0<\/code>: the integer zero.<\/li>\n<li><code>\"0\"<\/code>: a string containing the character ‘0’ (value 48)\nand a terminator.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B17", "title": "Strings in C: what are the common pitfalls?", "html": "<ul>\n<li>A string is a <code>char<\/code> array ending with <code>'\\0'<\/code>.\nForgetting space for <code>'\\0'<\/code> is the number one bug.<\/li>\n<li><code>strcpy<\/code> has no bounds check, so it can overflow the\nbuffer. <code>strncpy<\/code> does not add <code>'\\0'<\/code> if the\nsource is as long as the limit, so terminate manually.<\/li>\n<li><code>==<\/code> on strings compares addresses, not content. Use\n<code>strcmp<\/code>.<\/li>\n<li><code>sizeof<\/code> on a pointer gives pointer size, not string\nlength.<\/li>\n<\/ul>\n<pre class=\"c\"><code>char buf[8];\nstrncpy(buf, src, sizeof(buf) - 1);\nbuf[sizeof(buf) - 1] = &#39;\\0&#39;;<\/code><\/pre>\n", "hook": "", "hot": true, "lab": ""}, {"id": "B18", "title": "`strcpy` vs `strncpy` vs `memcpy`?", "html": "<ul>\n<li><code>strcpy(d, s)<\/code>: copies until <code>'\\0'<\/code>. No limit,\nso it is dangerous.<\/li>\n<li><code>strncpy(d, s, n)<\/code>: copies at most n chars, pads with\nzeros if shorter, but does not terminate if s is n or longer.<\/li>\n<li><code>memcpy(d, s, n)<\/code>: copies exactly n bytes and ignores\n<code>'\\0'<\/code>. Works for any data.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B19", "title": "Array of pointers vs pointer to array?", "html": "<ul>\n<li><code>int *a[5];<\/code> is an <strong>array of 5 int\npointers<\/strong>.<\/li>\n<li><code>int (*a)[5];<\/code> is a <strong>pointer to an array of 5\nints<\/strong>.<\/li>\n<\/ul>\n<p><strong>How to read it:<\/strong> start at the name, go right, then\nleft, using parentheses first. <code>int (*fp)(int)<\/code> reads: fp is\na pointer to a function taking int and returning int.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B20", "title": "How are 2D arrays stored? How do you pass them to a function?", "html": "<p>Stored in <strong>row-major<\/strong> order, as one continuous block:\n<code>a[0][0], a[0][1], ..., a[1][0], ...<\/code>.<\/p>\n<p><code>a[i][j]<\/code> equals <code>*(*(a + i) + j)<\/code>.<\/p>\n<pre class=\"c\"><code>void print(int a[][4], int rows);     // column count is mandatory\nvoid print2(int (*a)[4], int rows);   // same thing<\/code><\/pre>\n<p><strong>Logic:<\/strong> the compiler needs the column count to\ncalculate the offset <code>i * cols + j<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B21", "title": "What is a pointer to a pointer? When is it used?", "html": "<p><code>int **pp<\/code> holds the address of an <code>int *<\/code>.\nUses: a function that must change the caller’s pointer (for example,\nallocate memory for it), arrays of strings (<code>char **argv<\/code>),\nand linked list head updates.<\/p>\n<pre class=\"c\"><code>void alloc(int **p) { *p = malloc(sizeof(int)); }\nint *q; alloc(&amp;q);<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B22", "title": "What causes a segmentation fault?", "html": "<ul>\n<li>Dereferencing a null, wild or dangling pointer<\/li>\n<li>Array index far out of bounds<\/li>\n<li>Writing to read-only memory (string literal)<\/li>\n<li>Stack overflow (infinite recursion, huge local array)<\/li>\n<\/ul>\n<p><strong>Embedded note:<\/strong> most microcontrollers have no MMU, so\nyou often get a <strong>HardFault<\/strong> or silent memory corruption\ninstead of a segfault.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B23", "title": "What are enums and what are their pitfalls?", "html": "<p>An enum is a set of named integer constants. Values start at 0 and\nincrease by 1 unless assigned. In C, enums are not type-safe: you can\nassign any int to an enum variable. Size of an enum is\nimplementation-defined (usually <code>int<\/code>).<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B24", "title": "What is `inline`? What is `restrict`?", "html": "<ul>\n<li><code>inline<\/code>: a hint to put the function body at the call\nsite to avoid call overhead. In headers use <code>static inline<\/code>\nto avoid multiple-definition errors.<\/li>\n<li><code>restrict<\/code> (C99): a promise that a pointer is the only\nway to access that memory, so the compiler can optimize more.\n<code>memcpy<\/code> uses <code>restrict<\/code>, which is why overlap is\nundefined. <code>memmove<\/code> does not.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B25", "title": "What is the difference between implementation-defined, unspecified and undefined behavior?", "html": "<ul>\n<li><strong>Implementation-defined:<\/strong> compiler must document the\nchoice (size of <code>int<\/code>, right shift of negative numbers).<\/li>\n<li><strong>Unspecified:<\/strong> several valid results, no\ndocumentation needed (order of evaluating function arguments).<\/li>\n<li><strong>Undefined:<\/strong> no rules at all (null dereference,\nsigned overflow).<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B26", "title": "Why should we not compare floating-point numbers with `==`?", "html": "<p>Floats cannot represent most decimals exactly (0.1 is a repeating\nfraction in binary). Results of calculations carry small rounding\nerrors. Compare with a tolerance instead.<\/p>\n<pre class=\"c\"><code>if (fabsf(a - b) &lt; 1e-6f) { }<\/code><\/pre>\n<p><strong>Embedded note:<\/strong> many MCUs have no floating-point unit\n(FPU), so float math is done in slow software. Prefer integers or\nfixed-point. Write float constants as <code>1.5f<\/code>, otherwise they\nare promoted to <code>double<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B27", "title": "How do variable-argument functions (like `printf`) work?", "html": "<p>They use <code>&lt;stdarg.h&gt;<\/code>: <code>va_list<\/code>,\n<code>va_start<\/code>, <code>va_arg<\/code>, <code>va_end<\/code>. The\nfunction needs at least one fixed argument to know how many follow (for\n<code>printf<\/code>, the format string tells it). There is no type\nchecking, so a wrong format specifier is undefined behavior.<\/p>\n<pre class=\"c\"><code>int sum(int n, ...) {\n    va_list ap; va_start(ap, n);\n    int s = 0;\n    while (n--) s += va_arg(ap, int);\n    va_end(ap);\n    return s;\n}<\/code><\/pre>\n<p><strong>Embedded note:<\/strong> <code>printf<\/code> is large, slow,\nuses lots of stack and is often not reentrant. Use a light print\nfunction or ITM/UART logging.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B28", "title": "`void f()` vs `void f(void)`?", "html": "<p>In C (before C23), <code>f()<\/code> means “unspecified arguments”, so\nthe compiler will not complain if you call <code>f(1, 2)<\/code>.\n<code>f(void)<\/code> means no arguments. Always write\n<code>(void)<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B29", "title": "What is an lvalue and an rvalue?", "html": "<ul>\n<li><strong>lvalue:<\/strong> has a memory location and can appear on the\nleft of <code>=<\/code> (a variable, <code>*p<\/code>,\n<code>arr[i]<\/code>).<\/li>\n<li><strong>rvalue:<\/strong> just a value (<code>5<\/code>,\n<code>a + b<\/code>).<\/li>\n<\/ul>\n<p><code>5 = x;<\/code> and <code>(a + b) = 3;<\/code> are errors because\nthey are not lvalues.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B30", "title": "Switch statement: what is fall-through? What should you always add?", "html": "<p>Without <code>break<\/code>, execution continues into the next case.\nSometimes intentional (grouping cases), usually a bug. Always add a\n<code>default:<\/code> case, especially in embedded code, to handle\nunexpected values (for example a corrupted state variable).<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B31", "title": "What is the `sizeof` operator? Does it evaluate its operand?", "html": "<p><code>sizeof<\/code> is a compile-time operator, not a function. It\ndoes not evaluate expressions inside it:\n<code>int i = 5; sizeof(i++);<\/code> leaves i at 5. Its result type is\n<code>size_t<\/code> (print with <code>%zu<\/code>).<\/p>\n<p><strong>Trick:<\/strong> <code>sizeof(arr) / sizeof(arr[0])<\/code>\ngives the element count, but only where <code>arr<\/code> is a real array\nand not a function parameter.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B32", "title": "What is a header file for? What should and should not go in it?", "html": "<p><strong>Should:<\/strong> function declarations, <code>extern<\/code>\nvariable declarations, macros, typedefs, struct/enum definitions,\n<code>static inline<\/code> functions, include guards.<\/p>\n<p><strong>Should not:<\/strong> variable definitions or non-inline\nfunction definitions (multiple-definition errors).<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B33", "title": "Why is `main` returning an int? What if `main` returns in embedded?", "html": "<p>On a PC, the return value goes to the OS. In embedded there is no OS\nto return to, so <code>main<\/code> normally never returns\n(<code>while (1)<\/code>). If it does return, the startup code usually\nfalls into an infinite loop or resets, which is usually a bug.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B34", "title": "What is a memory alignment and why does it matter?", "html": "<p>Alignment means placing data at an address that is a multiple of its\nsize (a 4-byte int at an address divisible by 4). Aligned access is\nfaster, and some CPUs (such as Cortex-M0) fault on unaligned access.\nCasting a <code>char<\/code> buffer to <code>int *<\/code> can cause this\nproblem.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B35", "title": "What is type casting? Implicit vs explicit?", "html": "<ul>\n<li><strong>Implicit:<\/strong> the compiler converts automatically\n(<code>int<\/code> to <code>float<\/code>, <code>char<\/code> to\n<code>int<\/code>).<\/li>\n<li><strong>Explicit:<\/strong> you write <code>(type)value<\/code>.<\/li>\n<\/ul>\n<p>Danger: converting to a smaller type loses data, and casting between\npointer types can break alignment and aliasing rules.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B36", "title": "What is strict aliasing and type punning?", "html": "<p>Accessing an object through a pointer of an incompatible type is\nundefined behavior, and the compiler may optimize assuming it never\nhappens. For safe type punning, use <code>memcpy<\/code> or a\n<code>union<\/code>.<\/p>\n<pre class=\"c\"><code>float f = 1.5f; uint32_t u;\nmemcpy(&amp;u, &amp;f, sizeof(u));   // safe way to see the bits of a float<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B37", "title": "What is the ternary operator?", "html": "<p><code>cond ? a : b<\/code> is a compact if-else expression:\n<code>max = (a &gt; b) ? a : b;<\/code>. It has low precedence, so wrap\nit in parentheses inside bigger expressions.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B38", "title": "How does `goto` work? Is it ever acceptable?", "html": "<p>It jumps to a label in the same function. It is generally avoided\nbecause it makes code hard to follow, but a single\n<code>goto cleanup;<\/code> for error handling in drivers is accepted by\nmany teams (MISRA discourages it).<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "B39", "title": "`break` vs `continue` vs `return`?", "html": "<ul>\n<li><code>break<\/code> exits the nearest loop or switch.<\/li>\n<li><code>continue<\/code> skips to the next loop iteration.<\/li>\n<li><code>return<\/code> exits the whole function.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}]}, {"id": "C", "title": "Bit Manipulation", "short": "Bit manipulation", "icon": "🔢", "blurb": "Bit manipulation: set, clear, toggle, extract and tricks", "questions": [{"id": "C0", "title": "The four core bit operations (memorize these)", "html": "<p><strong>Four core operations (memorize):<\/strong><\/p>\n<pre class=\"c\"><code>reg |=  (1U &lt;&lt; n);          // SET bit n\nreg &amp;= ~(1U &lt;&lt; n);          // CLEAR bit n\nreg ^=  (1U &lt;&lt; n);          // TOGGLE bit n\nbit  = (reg &gt;&gt; n) &amp; 1U;     // CHECK (read) bit n<\/code><\/pre>\n<p><strong>Logic:<\/strong> <code>1U &lt;&lt; n<\/code> builds a mask with\nonly bit n high. OR with the mask forces the bit to 1. AND with the\ninverted mask forces it to 0. XOR flips it. Shift then AND reads it.<\/p>\n<p><strong>Remember:<\/strong> “OR sets, AND-NOT clears, XOR toggles,\nshift-AND checks.”<\/p>\n", "hook": "OR sets, AND-NOT clears, XOR toggles, shift-AND checks.", "hot": true, "lab": "bits"}, {"id": "C1", "title": "How do you set, clear and toggle multiple bits?", "html": "<pre class=\"c\"><code>reg |=  (BIT3 | BIT5);        // set bits 3 and 5\nreg &amp;= ~(BIT3 | BIT5);        // clear bits 3 and 5\nreg ^=  (BIT3 | BIT5);        // toggle bits 3 and 5<\/code><\/pre>\n<p>A handy macro set:<\/p>\n<pre class=\"c\"><code>#define BIT(n)        (1U &lt;&lt; (n))\n#define SET_BIT(r,n)  ((r) |=  BIT(n))\n#define CLR_BIT(r,n)  ((r) &amp;= ~BIT(n))\n#define TGL_BIT(r,n)  ((r) ^=  BIT(n))\n#define GET_BIT(r,n)  (((r) &gt;&gt; (n)) &amp; 1U)<\/code><\/pre>\n", "hook": "", "hot": true, "lab": "bits"}, {"id": "C2", "title": "How do you modify a multi-bit field (for example a 3-bit field at position 4)?", "html": "<pre class=\"c\"><code>reg = (reg &amp; ~(0x7U &lt;&lt; 4)) | ((val &amp; 0x7U) &lt;&lt; 4);<\/code><\/pre>\n<p><strong>Logic:<\/strong> first clear the whole field (a mask with 3\nones, shifted into place and inverted), then OR in the new value,\nshifted into place. Masking <code>val<\/code> protects the neighbouring\nbits.<\/p>\n", "hook": "", "hot": true, "lab": "bits"}, {"id": "C3", "title": "How do you extract bits (for example 4 bits starting at bit 8)?", "html": "<pre class=\"c\"><code>field = (reg &gt;&gt; 8) &amp; 0xFU;     // shift down, then mask 4 bits<\/code><\/pre>\n<p>General form:\n<code>(x &gt;&gt; pos) &amp; ((1U &lt;&lt; len) - 1)<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": "bits"}, {"id": "C4", "title": "Check whether a number is odd or even", "html": "<pre class=\"c\"><code>if (n &amp; 1) { /* odd */ }<\/code><\/pre>\n<p><strong>Logic:<\/strong> the lowest bit is 1 for every odd number.<\/p>\n", "hook": "", "hot": false, "lab": "bits"}, {"id": "C5", "title": "Multiply and divide by powers of 2", "html": "<p><code>x &lt;&lt; n<\/code> equals x times\n2^n. <code>x &gt;&gt; n<\/code> equals x divided by 2^n (unsigned). It is\nfast on MCUs without a hardware divider.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C6", "title": "Count the set bits (Kernighan's method)", "html": "<pre class=\"c\"><code>int count(uint32_t n) {\n    int c = 0;\n    while (n) { n &amp;= (n - 1); c++; }\n    return c;\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> <code>n &amp; (n - 1)<\/code> removes the\nlowest set bit each time, so the loop runs once per set bit. Example:\n<code>1100 &amp; 1011 = 1000<\/code>.<\/p>\n", "hook": "", "hot": true, "lab": "bits"}, {"id": "C7", "title": "Check whether a number is a power of two", "html": "<pre class=\"c\"><code>bool isPow2(uint32_t n) { return n &amp;&amp; !(n &amp; (n - 1)); }<\/code><\/pre>\n<p><strong>Logic:<\/strong> a power of two has exactly one set bit, and\n<code>n &amp; (n - 1)<\/code> clears it, giving 0.<\/p>\n", "hook": "", "hot": true, "lab": "bits"}, {"id": "C8", "title": "Swap two numbers without a temporary variable", "html": "<pre class=\"c\"><code>a ^= b;  b ^= a;  a ^= b;<\/code><\/pre>\n<p><strong>Logic:<\/strong> XOR properties: <code>x ^ x = 0<\/code> and\n<code>x ^ 0 = x<\/code>. Warning: if <code>a<\/code> and <code>b<\/code>\nare the same variable (for example <code>swap(&amp;x, &amp;x)<\/code>),\nthe value becomes 0. Using a temp variable is clearer and just as\nfast.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "C9", "title": "Swap the two nibbles of a byte", "html": "<pre class=\"c\"><code>x = ((x &amp; 0x0F) &lt;&lt; 4) | ((x &amp; 0xF0) &gt;&gt; 4);<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C10", "title": "Reverse the bits of a byte", "html": "<pre class=\"c\"><code>uint8_t rev(uint8_t x) {\n    uint8_t r = 0;\n    for (int i = 0; i &lt; 8; i++) {\n        r = (r &lt;&lt; 1) | (x &amp; 1);\n        x &gt;&gt;= 1;\n    }\n    return r;\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> take the lowest bit of x and push it into the\nlowest position of r, shifting r left each time.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C11", "title": "Swap the bytes of a 32-bit number (endian conversion)", "html": "<pre class=\"c\"><code>uint32_t swap32(uint32_t x) {\n    return ((x &gt;&gt; 24) &amp; 0x000000FF) |\n           ((x &gt;&gt;  8) &amp; 0x0000FF00) |\n           ((x &lt;&lt;  8) &amp; 0x00FF0000) |\n           ((x &lt;&lt; 24) &amp; 0xFF000000);\n}<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C12", "title": "Swap odd and even bits", "html": "<pre class=\"c\"><code>x = ((x &amp; 0xAAAAAAAAU) &gt;&gt; 1) | ((x &amp; 0x55555555U) &lt;&lt; 1);<\/code><\/pre>\n<p><code>0xAAAAAAAA<\/code> selects the odd positions,\n<code>0x55555555<\/code> selects the even positions.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C13", "title": "Find the number that appears once when all others appear twice", "html": "<pre class=\"c\"><code>int single(int *a, int n) { int r = 0; for (int i = 0; i &lt; n; i++) r ^= a[i]; return r; }<\/code><\/pre>\n<p><strong>Logic:<\/strong> equal numbers cancel\n(<code>x ^ x = 0<\/code>), and what remains is the single one.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C14", "title": "Isolate the lowest set bit", "html": "<pre class=\"c\"><code>lowest = n &amp; -n;      // for example 0b101000 -&gt; 0b001000<\/code><\/pre>\n<p><strong>Logic:<\/strong> <code>-n<\/code> is the two’s complement\n(<code>~n + 1<\/code>), which keeps the lowest set bit and flips all bits\nabove it.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C15", "title": "Rotate a 32-bit value left by n bits", "html": "<pre class=\"c\"><code>uint32_t rotl(uint32_t x, unsigned n) { n &amp;= 31; return n ? (x &lt;&lt; n) | (x &gt;&gt; (32 - n)) : x; }<\/code><\/pre>\n<p>(The <code>n ?<\/code> check avoids shifting by 32, which is\nundefined.)<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C16", "title": "Convert a lowercase letter to uppercase using bits", "html": "<pre class=\"c\"><code>c &amp;= ~0x20;    // clears bit 5: &#39;a&#39; (0x61) -&gt; &#39;A&#39; (0x41)\nc ^= 0x20;     // toggles case<\/code><\/pre>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C17", "title": "Check whether two integers have opposite signs", "html": "<pre class=\"c\"><code>bool opposite = ((a ^ b) &lt; 0);<\/code><\/pre>\n<p>The sign bits differ, so XOR has the sign bit set.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "C18", "title": "What are the pitfalls of bit manipulation?", "html": "<ul>\n<li><code>1 &lt;&lt; 31<\/code> on a signed int is undefined. Write\n<code>1U &lt;&lt; 31<\/code>.<\/li>\n<li>Right-shifting negative signed numbers is\nimplementation-defined.<\/li>\n<li>Mixing <code>uint8_t<\/code> with shifts: <code>uint8_t<\/code>\npromotes to <code>int<\/code>, so <code>~x<\/code> on a\n<code>uint8_t<\/code> gives an <code>int<\/code> with high bits set. Cast\nthe result: <code>(uint8_t)~x<\/code>.<\/li>\n<li>Operator precedence: write\n<code>(reg &amp; MASK) == MASK<\/code>.<\/li>\n<li>Read-modify-write (<code>reg |= bit<\/code>) on a hardware register\nis three steps (read, modify, write) and can lose an update if an\ninterrupt changes the register in between. See E9.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}]}, {"id": "D", "title": "Embedded C Core", "short": "Embedded core", "icon": "⚙️", "blurb": "Registers, ISRs, startup, memory and RTOS basics", "questions": [{"id": "D1", "title": "How do you access a hardware register in C?", "html": "<pre class=\"c\"><code>#define GPIOA_ODR (*(volatile uint32_t *)0x48000014U)\nGPIOA_ODR |= (1U &lt;&lt; 5);   // set pin 5<\/code><\/pre>\n<p><strong>Logic:<\/strong> cast the address to a pointer to volatile,\nthen dereference it. <code>volatile<\/code> makes sure every read and\nwrite really reaches the hardware.<\/p>\n<p><strong>Better style:<\/strong> map a whole peripheral with a\nstruct.<\/p>\n<pre class=\"c\"><code>typedef struct {\n    volatile uint32_t MODER;    // offset 0x00\n    volatile uint32_t OTYPER;   // offset 0x04\n    volatile uint32_t ODR;      // offset 0x14 ... (padding/reserved members as needed)\n} GPIO_TypeDef;\n#define GPIOA ((GPIO_TypeDef *)0x48000000U)\nGPIOA-&gt;ODR |= (1U &lt;&lt; 5);<\/code><\/pre>\n<p><strong>Logic:<\/strong> the members of the struct lie at increasing\noffsets in the same order as the hardware registers, so\n<code>GPIOA-&gt;ODR<\/code> becomes the right address.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "D2", "title": "What are the rules for writing an ISR?", "html": "<ul>\n<li>Keep it <strong>short and fast<\/strong>. Set a flag or copy data to\na buffer, and do the heavy work in the main loop or a task.<\/li>\n<li><strong>No blocking calls, no delays, no <code>printf<\/code>, no\n<code>malloc<\/code>.<\/strong><\/li>\n<li>Do not call non-reentrant functions.<\/li>\n<li>Use <code>volatile<\/code> for variables shared with main code.<\/li>\n<li>An ISR takes <strong>no arguments and returns nothing<\/strong>,\nbecause the hardware calls it, so there is no caller to pass or receive\nvalues.<\/li>\n<li>Clear the interrupt flag, or the ISR will fire again\nimmediately.<\/li>\n<li>Avoid floating-point in ISRs (it may need extra context\nsaving).<\/li>\n<\/ul>\n", "hook": "Short, no blocking, flag it, clear it.", "hot": true, "lab": "isr"}, {"id": "D3", "title": "What happens when an interrupt occurs (Cortex-M)?", "html": "<ol type=\"1\">\n<li>The CPU finishes the current instruction.<\/li>\n<li>Hardware <strong>stacks<\/strong> the context (R0 to R3, R12, LR, PC,\nxPSR).<\/li>\n<li>It reads the handler address from the <strong>vector table<\/strong>\nand runs the ISR.<\/li>\n<li>On return, the context is <strong>unstacked<\/strong> and the main\ncode resumes.<\/li>\n<\/ol>\n<p><strong>Interrupt latency<\/strong> is the time from the interrupt\nrequest to the first ISR instruction. It is affected by interrupt\nmasking, higher-priority interrupts and the instruction in progress.\nWith nested interrupts (NVIC priorities), a higher-priority interrupt\ncan preempt a lower one.<\/p>\n", "hook": "", "hot": true, "lab": "isr"}, {"id": "D4", "title": "What is a race condition? How do you protect shared data?", "html": "<p>A race condition is when the result depends on the timing between the\nISR and main code. Example: on an 8-bit MCU, main reads a 16-bit\nvariable in two steps, and the ISR updates it between the two reads, so\nmain gets half old and half new data.<\/p>\n<p><strong>Fixes:<\/strong><\/p>\n<ul>\n<li>A critical section (briefly disable interrupts around the\naccess)<\/li>\n<li>Atomic operations<\/li>\n<li>A mutex (RTOS)<\/li>\n<li>A double buffer or a lock-free single-producer single-consumer\nqueue<\/li>\n<\/ul>\n", "hook": "", "hot": true, "lab": ""}, {"id": "D5", "title": "Reentrant vs thread-safe function?", "html": "<p>A <strong>reentrant<\/strong> function can be interrupted and called\nagain before the first call finishes. It uses no static or global data\n(only locals and parameters) and calls only other reentrant functions.\nThis is required for functions shared with ISRs.<\/p>\n<p><strong>Thread-safe<\/strong> means safe when called from multiple\nthreads, possibly using locks. Reentrant implies thread-safe, but not\nthe reverse.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "D6", "title": "Describe what happens from reset to `main()`.", "html": "<ol type=\"1\">\n<li>The CPU loads the <strong>initial stack pointer<\/strong> from the\nfirst vector table entry and the <strong>Reset_Handler address<\/strong>\nfrom the second.<\/li>\n<li><code>Reset_Handler<\/code> runs the startup code. It copies\n<code>.data<\/code> from Flash to RAM and zeroes <code>.bss<\/code>.<\/li>\n<li>It calls <code>SystemInit()<\/code> (clock setup, etc.) and the C\nlibrary init (constructors, heap).<\/li>\n<li>It calls <code>main()<\/code>.<\/li>\n<\/ol>\n<p>This answer shows you understand the system beyond C syntax.<\/p>\n", "hook": "SP, Reset_Handler, copy .data, zero .bss, main.", "hot": true, "lab": "startup"}, {"id": "D7", "title": "What is a linker script?", "html": "<p>It tells the linker the memory regions (FLASH and RAM with start\naddresses and sizes) and which sections (<code>.text<\/code>,\n<code>.data<\/code>, <code>.bss<\/code>, stack, heap) go where. It also\ndefines symbols the startup code uses, such as <code>_sdata<\/code>,\n<code>_edata<\/code> and <code>_ebss<\/code>.<\/p>\n", "hook": "", "hot": false, "lab": "startup"}, {"id": "D8", "title": "Why avoid `malloc` in embedded systems?", "html": "<ul>\n<li>Heap <strong>fragmentation<\/strong> over time can make allocation\nfail even when enough total memory is free.<\/li>\n<li><strong>Non-deterministic timing<\/strong>, which is bad for\nreal-time systems.<\/li>\n<li>Leaks are fatal when a device runs for years.<\/li>\n<li>Limited RAM, and no OS to clean up.<\/li>\n<\/ul>\n<p><strong>Alternative:<\/strong> static allocation or fixed-size memory\npools.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "D9", "title": "Polling vs interrupt vs DMA?", "html": "<ul>\n<li><strong>Polling:<\/strong> the CPU repeatedly checks a status flag.\nSimple, but wastes CPU time.<\/li>\n<li><strong>Interrupt:<\/strong> the hardware notifies the CPU on an\nevent. Efficient, but has ISR overhead and race risks.<\/li>\n<li><strong>DMA:<\/strong> a controller moves data between memory and a\nperipheral without the CPU. Best for bulk transfers (ADC streams, UART\nbuffers).<\/li>\n<\/ul>\n<p><strong>Analogy:<\/strong> polling is checking the oven every minute,\nan interrupt is a timer that rings, DMA is a helper who carries the\ndishes while you keep cooking.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "D10", "title": "What is a watchdog timer?", "html": "<p>A hardware timer that resets the MCU if the software does not “kick”\n(refresh) it in time. It recovers the system from hangs and infinite\nloops. Kick it only from a healthy place in the code (after checking\nthat all important tasks are alive), not blindly from a timer ISR.<\/p>\n", "hook": "", "hot": true, "lab": ""}, {"id": "D11", "title": "What is switch debouncing?", "html": "<p>A mechanical switch bounces for a few milliseconds when pressed,\nproducing false multiple edges.<\/p>\n<ul>\n<li><strong>Hardware fix:<\/strong> RC filter or Schmitt trigger.<\/li>\n<li><strong>Software fix:<\/strong> delay and re-read, or require the\nsame reading for N consecutive samples (for example every 10 ms).<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "D12", "title": "Mutex vs semaphore? What is priority inversion?", "html": "<ul>\n<li><strong>Mutex:<\/strong> guards a shared resource and has an\n<strong>owner<\/strong>. Only the task that locked it can unlock it.<\/li>\n<li><strong>Semaphore:<\/strong> a signaling mechanism with no owner. It\ncan be binary or counting, and an ISR can give a semaphore to wake a\ntask.<\/li>\n<li><strong>Priority inversion:<\/strong> a low-priority task holds a\nmutex, a high-priority task waits for it, and a medium-priority task\npreempts the low one, so the high-priority task is blocked indefinitely.\n<strong>Fix:<\/strong> priority inheritance (the low task temporarily\ngets the high task’s priority).<\/li>\n<\/ul>\n", "hook": "Mutex = lock with owner, semaphore = signal. Inversion fix: inherit.", "hot": true, "lab": ""}, {"id": "D13", "title": "How do you detect stack overflow?", "html": "<p>Fill the stack with a known pattern at startup (“stack painting”) and\ncheck how much has been overwritten, or use a canary value at the stack\nend, an MPU guard region or RTOS stack-check hooks. Prevent it by\navoiding large local arrays, deep recursion and big structs passed by\nvalue.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "D14", "title": "The ISR sets a flag but main never sees it at `-O2`. What is wrong?", "html": "<p>The flag is missing <code>volatile<\/code>. At <code>-O0<\/code> the\ncompiler reloads everything from memory, so the code works. At\n<code>-O2<\/code> it caches the value in a register and removes\n“redundant” reads. Fix: declare the flag <code>volatile<\/code>. If code\nworks in debug but fails in release, suspect <code>volatile<\/code> or a\nrace condition first.<\/p>\n<pre class=\"c\"><code>volatile bool data_ready = false;\nvoid UART_IRQHandler(void) { data_ready = true; }\nint main(void) { while (!data_ready) { } /* process */ }<\/code><\/pre>\n", "hook": "", "hot": true, "lab": "volatile"}, {"id": "D15", "title": "Super loop vs RTOS?", "html": "<p>A super loop (<code>while (1) { ... }<\/code> plus ISRs) is simple and\nhas low overhead, but timing is hard to guarantee as the system grows.\nAn RTOS gives tasks, priorities, preemptive scheduling and inter-task\ncommunication (queues, semaphores, mutexes). The cost is memory,\ncomplexity and context-switch overhead.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "D16", "title": "GPIO modes: push-pull vs open-drain, pull-up vs pull-down?", "html": "<ul>\n<li><strong>Push-pull:<\/strong> the output actively drives both high and\nlow.<\/li>\n<li><strong>Open-drain:<\/strong> it can only pull low, and needs a\npull-up resistor for the high level (used in I2C, which allows several\ndevices to share one wire, a “wired-AND”).<\/li>\n<li><strong>Pull-up / pull-down:<\/strong> keeps a floating input at a\ndefined level so it does not read random noise.<\/li>\n<\/ul>\n", "hook": "", "hot": false, "lab": ""}, {"id": "D17", "title": "How do you write a vector table and a default handler in C?", "html": "<pre class=\"c\"><code>void Reset_Handler(void);\nvoid NMI_Handler(void)  __attribute__((weak, alias(&quot;Default_Handler&quot;)));\nvoid USART1_IRQHandler(void) __attribute__((weak, alias(&quot;Default_Handler&quot;)));\n\n__attribute__((section(&quot;.isr_vector&quot;)))\nvoid (*const vectors[])(void) = {\n    (void (*)(void))(&amp;_estack),   // initial stack pointer\n    Reset_Handler,\n    NMI_Handler,\n    /* ... */\n};<\/code><\/pre>\n<p><strong>Logic:<\/strong> the vector table is an array of function\npointers placed at the start of Flash by the linker script.\n<code>weak<\/code> handlers let you override them just by defining a\nfunction with the same name in your code.<\/p>\n", "hook": "", "hot": false, "lab": ""}, {"id": "D18", "title": "How do the main loop and ISR work together? (the event-flag pattern)", "html": "<p>The ISR only records that something happened. The main loop does the\nwork.<\/p>\n<pre class=\"c\"><code>volatile uint8_t rx_byte; volatile bool rx_ready;\nvoid USART_IRQHandler(void) { rx_byte = USART-&gt;DR; rx_ready = true; }\n\nint main(void) {\n    init();\n    while (1) {\n        if (rx_ready) { rx_ready = false; handle(rx_byte); }\n    }\n}<\/code><\/pre>\n<p><strong>Logic:<\/strong> keeps ISRs short and keeps the processing in\na context where you can do anything.<\/p>\n", "hook": "", "hot": false, "lab": "volatile"}]}, {"id": "E", "title": "More Embedded Questions", "short": "Hardware and protocols", "icon": "🔌", "blurb": "Hardware, timers, ADC, UART, SPI, I2C, CAN, low power, debugging", "questions": [{"id": "E1", "title": "Microcontroller (MCU) vs microprocessor (MPU)?", "html": "<ul>\n<li><strong>MCU:<\/strong> CPU + RAM + Flash + peripherals (GPIO, timers,\nADC, UART) on one chip. Cheap, low power, runs bare-metal or RTOS\nfirmware. Examples: STM32, AVR, PIC, ESP32.<\/li>\n<li><strong>MPU:<\/strong> mostl
