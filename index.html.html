      h('button', { class: 'btn sm', disabled: k === 0, onclick: () => { [mem[k - 1], mem[k]] = [mem[k], mem[k - 1]]; draw(); } }, '↑'), h('button', { class: 'btn sm', disabled: k === mem.length - 1, onclick: () => { [mem[k + 1], mem[k]] = [mem[k], mem[k + 1]]; draw(); } }, '↓'), h('button', { class: 'btn sm', onclick: () => { mem.splice(k, 1); draw(); } }, '✕'))));
    out.innerHTML = '';
    out.append(h('div', { class: 'cells' }, L.cells.map((c, i) => c.pad ? h('div', { class: 'cell pad', title: 'padding' }, 'pad', h('small', {}, '' + i)) : h('div', { class: 'cell', style: `background:${COL[c.k % 6]};color:#13203B;border-color:transparent` }, c.first ? mem[c.k].n : '·', h('small', {}, '' + i)))),
      h('div', { class: 'row', style: 'margin-top:12px' }, h('span', { class: 'chip on' }, `sizeof = ${L.size} bytes`), h('span', { class: 'chip' }, `data ${L.used}`), h('span', { class: L.size - L.used ? 'chip' : 'chip on', style: L.size - L.used ? 'border-color:var(--bad);color:var(--bad)' : '' }, `wasted ${L.size - L.used}`)),
      h('pre', { class: 'c' }, h('code', {}, 'struct S {\n' + mem.map(m => `    ${m.t} ${m.n};`).join('\n') + '\n}' + (packed ? ' __attribute__((packed))' : '') + ';')));
    highlight(out);
  }
  const addSel = sel(Object.keys(T), 'int', () => { });
  const ctl = h('div', { class: 'ctl' }, addSel, h('button', { class: 'btn', onclick: () => { mem.push({ t: addSel.value, n: String.fromCharCode(97 + (cnt++ % 26)) }); draw(); } }, 'Add member'),
    h('button', { class: 'btn', onclick: () => { mem.sort((a, b) => T[b.t] - T[a.t]); draw(); } }, 'Sort largest first'), h('button', { class: 'btn', onclick: () => { mem = [{ t: 'char', n: 'a' }, { t: 'int', n: 'b' }, { t: 'char', n: 'c' }]; cnt = 3; draw(); } }, 'Reset'),
    h('label', {}, h('input', { type: 'checkbox', onchange: e => { packed = e.target.checked; draw(); } }), 'packed'));
  root.append(h('p', { class: 'small muted' }, 'Each member must start at an address that is a multiple of its own size (a double needs 8). Hatched cells are padding the compiler inserts. Move members around and watch the size.'), ctl, list, out,
    h('div', { class: 'callout' }, '💡 ', h('b', {}, 'Remember: '), 'Order members from largest to smallest. Use packed only when you must, because unaligned access can be slow or fault.'));
  draw();
}

/* ===== 4. POINTER ARITHMETIC ===== */
function labPointer(root) {
  const T = { char: 1, short: 2, int: 4, double: 8 }; let ty = 'int', base = 0x1000, k = 2;
  const out = h('div', {}); const range = h('input', { type: 'range', min: 0, max: 3, value: k, oninput: e => { k = Number(e.target.value); draw(); } });
  function draw() {
    const sz = T[ty]; const maxK = Math.min(5, Math.floor(32 / sz) - 1); range.max = maxK; if (k > maxK) { k = maxK; range.value = k; }
    const cells = []; for (let i = 0; i < 32; i++) { const el = Math.floor(i / sz); const inCur = el === k; const starts = i % sz === 0 && el <= maxK;
      cells.push(h('div', { class: 'cell' + (inCur ? ' mark' : ''), style: inCur ? 'background:var(--soft)' : el < k ? 'opacity:.75' : '' }, starts ? h('b', {}, el === 0 ? 'p' : 'p+' + el) : '·', h('small', {}, (base + i).toString(16).toUpperCase()))); }
    out.innerHTML = ''; out.append(h('div', { class: 'cells' }, cells), eqh(`${ty} *p = ${hex(base, 4)};\n\np + ${k}  =  ${hex(base, 4)} + ${k} × sizeof(${ty})  =  ${hex(base, 4)} + ${k} × ${sz}  =  <span class="r">${hex(base + k * sz, 4)}</span>`),
      h('div', { class: 'callout' }, `The compiler scales by the pointed-to type: p + 1 moves ${sz} byte${sz > 1 ? 's' : ''}, not 1. That is why arr[i] is the same as *(arr + i).`));
  }
  root.append(h('div', { class: 'ctl' }, h('label', {}, 'Pointer type', sel(Object.keys(T), ty, x => { ty = x; draw(); })), h('label', {}, 'Base address (hex)', h('input', { type: 'text', value: '1000', oninput: e => { const x = parseInt(e.target.value, 16); if (!Number.isNaN(x)) { base = x; draw(); } } })), h('label', {}, 'n in p + n', range)), out); draw();
}

/* ===== 5. ENDIANNESS ===== */
function labEndian(root) {
  let val = 0x12345678; const out = h('div', {});

    const row = (title, arr, note) => h('div', { style: 'margin:12px 0' }, h('b', {}, title), h('div', { class: 'cells', style: 'margin-top:6px' }, arr.map((x, i) => h('div', { class: 'cell', style: `background:${COL[b.indexOf(x) < 0 ? 0 : arr === b ? i : 3 - i]};color:#13203B;border-color:transparent;width:70px` }, h('b', {}, x.toString(16).toUpperCase().padStart(2, '0')), h('small', {}, '0x' + (0x2000 + i).toString(16))))), h('div', { class: 'muted small' }, note));
    out.innerHTML = ''; out.append(eqh(`uint32_t x = ${hex(val, 8)};   // stored at address 0x2000`),
      row('Little-endian (ARM Cortex-M, x86)', b.slice().reverse(), `Least significant byte first, so the byte at the lowest address is ${hex(b[3], 2)}.`),
      row('Big-endian (network byte order)', b, `Most significant byte first, so the byte at the lowest address is ${hex(b[0], 2)}.`),
      h('pre', { class: 'c' }, h('code', {}, `uint16_t t = 0x0001;\nif (*(uint8_t *)&t == 1)   // true on little-endian\n    puts("Little endian");`)));
    highlight(out);
  }
  root.append(h('div', { class: 'ctl' }, h('label', {}, '32-bit value (hex)', h('input', { type: 'text', value: '12345678', maxlength: 8, oninput: e => { const x = parseInt(e.target.value, 16); if (!Number.isNaN(x)) { val = x >>> 0; draw(); } } })), h('button', { class: 'btn sm', onclick: () => { val = 0xDEADBEEF; draw(); } }, 'Try DEADBEEF')), out,
    h('div', { class: 'callout' }, '💡 ', h('b', {}, 'Remember: '), 'Little-endian = little end (least significant byte) first. Never cast a received byte buffer straight to a struct.')); draw();
}

/* ===== 6. INTEGER WRAP + SIGNED/UNSIGNED TRAP ===== */
function labWrap(root) {
  const TY = { uint8_t: [8, false], int8_t: [8, true], uint16_t: [16, false], int16_t: [16, true], uint32_t: [32, false], int32_t: [32, true] };
  let ty = 'uint8_t', val = 250; let msg = ''; const out = h('div', {}), cmp = h('div', {});
  const wrapV = (x, b, s) => { const m = 2 ** b; let r = ((x % m) + m) % m; if (s && r >= m / 2) r -= m; return r; };
  function draw() {
    const [b, s] = TY[ty]; const lo = s ? -(2 ** (b - 1)) : 0, hi = s ? 2 ** (b - 1) - 1 : 2 ** b - 1;
    out.innerHTML = ''; out.append(h('div', { class: 'row' }, h('span', { class: 'big-score' }, '' + val), h('span', { class: 'muted' }, `range ${lo} to ${hi}`)), h('div', { class: 'row mono' }, h('span', { class: 'chip on' }, hex(wrapV(val, b, false), b / 4)), h('span', { class: 'chip' }, '0b' + wrapV(val, b, false).toString(2).padStart(b, '0'))),
      msg ? h('div', { class: 'callout bigmsg' }, msg) : null, s ? h('div', { class: 'small muted' }, '⚠ In C, signed overflow is undefined behavior. The wrap you see here is what most hardware does, but the compiler is allowed to assume it never happens.') : h('div', { class: 'small muted' }, 'Unsigned overflow is well defined: it always wraps around.'));
  }
  function step(f) { const [b, s] = TY[ty]; const before = val; const nv = f(val); val = wrapV(nv, b, s); msg = nv !== val ? `Wrapped! ${before} → ${nv} becomes ${val}` : ''; draw(); }
  function drawCmp(si, ui) {
    const sU = (si >>> 0); const res = sU < ui; cmp.innerHTML = '';
    cmp.append(eqh(`int      s = ${si};\nunsigned u = ${ui};\n\nif (s &lt; u)  →  s is converted to unsigned: ${si} becomes <span class="m">${sU}</span>\n               ${sU} &lt; ${ui} is <span class="r">${res ? 'TRUE' : 'FALSE'}</span>`), h('div', { class: 'callout' }, si < ui && !res ? '😬 Mathematically s < u, but C says false. Never compare signed with unsigned.' : 'Try s = -1 and u = 1.'));
  }
  const tsel = sel(Object.keys(TY), ty, x => { ty = x; val = wrapV(val, ...TY[ty]); msg = ''; draw(); });
  root.append(h('div', { class: 'ctl' }, h('label', {}, 'Type', tsel), h('label', {}, 'Value', num(val, undefined, undefined, x => { val = wrapV(x, ...TY[ty]); msg = ''; draw(); })),

 { id:'I', title:'RTOS and Real-Time', short:'RTOS', icon:'⏱️', blurb:'Scheduling, priority inversion and ISR-to-task hand-off (FreeRTOS-style examples)', questions:[

   a:'A high-priority task blocks on a mutex held by a low-priority task, while a medium-priority task preempts the low one. The high task is effectively delayed by the medium task. Priority inheritance temporarily raises the holder to the waiter\'s priority so it can finish and release.',
   d:'Priority inversion is a scheduling bug, not a hardware fault: the highest-priority ready task is not the one running. It is classically blamed for the 1997 Mars Pathfinder resets.',
   w:'Low (L) takes mutex M. High (H) becomes ready, tries to take M and blocks. Medium (Me) becomes ready and, being higher than L, runs; L cannot run to release M, so H waits as long as Me runs. With inheritance, the kernel lifts L to H\'s priority while H waits, so Me cannot preempt L.',
   tag:'FreeRTOS API (needs FreeRTOS headers; not compiled here). Mutexes in FreeRTOS implement priority inheritance; binary semaphores do not.',
   code:`SemaphoreHandle_t m;            /* shared-resource lock */\nvoid init(void)  { m = xSemaphoreCreateMutex(); }\nvoid lowTask(void *arg) {\n  for (;;) {\n    xSemaphoreTake(m, portMAX_DELAY);  /* inheritance applies here */\n    use_shared_bus();\n    xSemaphoreGive(m);\n  }\n}`,
   ce:'<code>xSemaphoreCreateMutex()</code> gives an inheritance-capable lock. A binary semaphore here would still allow the inversion. Keep the locked region short.',
   p:'Shared SPI/I2C bus or logging UART used by a sensor task (low) and a control loop (high).',
   f:['Why can\'t you use a mutex from an ISR?','What is priority ceiling and how does it differ?'],
   m:'Thinking inheritance removes the delay completely: H still waits for L to finish the critical section. It only bounds the wait.',
   hook:'Mutex = ownership + inheritance. Semaphore = signalling.'}),
  mkQ('I2','How does an ISR safely wake a task?',{
   a:'Keep the ISR short. Use the ISR-specific kernel call (FromISR variant) to give a semaphore or post to a queue, then request a context switch on exit if a higher-priority task was woken.',
   d:'ISRs must not block, so they cannot call blocking APIs or take mutexes. They defer the work to a task, which keeps interrupt latency for other IRQs low.',
   w:'The ISR gives a semaphore; the kernel marks the waiting task ready and sets a flag. On ISR exit the port layer (or a yield request) switches to that task if it outranks the interrupted one.',
   tag:'FreeRTOS API on a Cortex-M style port (needs FreeRTOS headers; not compiled here).',
   code:`void UART_IRQHandler(void) {\n  BaseType_t woken = pdFALSE;\n  rx_byte = UART_DR;                       /* read clears the flag (MCU-specific) */\n  xSemaphoreGiveFromISR(rx_sem, &woken);\n  portYIELD_FROM_ISR(woken);               /* switch now if needed */\n}\nvoid rxTask(void *arg) {\n  for (;;) { xSemaphoreTake(rx_sem, portMAX_DELAY); handle(rx_byte); }\n}`,
   ce:'<code>FromISR</code> variants never block. <code>woken</code> tells the ISR whether a higher-priority task became ready. A queue is safer than one shared byte if bytes can arrive faster than the task runs.',
   p:'UART/DMA completion, button events, ADC end-of-conversion handled in a task.',
   f:['What if two bytes arrive before the task runs?','Which interrupt priorities may call FromISR APIs on Cortex-M?'],
   m:'Calling the plain <code>xSemaphoreGive</code> from an ISR, or doing long processing inside the ISR.',
   hook:'ISR: grab, signal, leave. Task: think.'})]},
 { id:'J', title:'Protocols in Practice', short:'Protocols+', icon:'🔌', blurb:'CAN arbitration and choosing a bus for a real product', questions:[
  mkQ('J1','How does CAN arbitration work, and why does the lowest ID win?',{hot:true,lab:'can',
   a:'All nodes transmit their ID bit by bit while listening to the bus. A dominant bit (0) overrides a recessive bit (1). A node that sends 1 but reads 0 has lost and stops. The lowest ID therefore wins without any frame being corrupted.',
   d:'It is non-destructive, bitwise arbitration (CSMA/CR). The bus behaves like a wired-AND, so priority is the numeric ID: lower value means higher priority.',
   w:'Nodes start on the same SOF bit, so IDs are compared from the MSB. At the first differing bit, the node sending 0 keeps the bus; the others become receivers and retry later.',
   tag:'Pure C model of the idea (compiles with any C99 compiler). It is a simulation, not a CAN driver.',
   code:`#include <stdint.h>\n/* returns index of the winning node (11-bit IDs, 0 = dominant) */\nint can_winner(const uint16_t *id, int n) {\n  uint8_t alive[16] = {0};\n  for (int i = 0; i < n; i++) alive[i] = 1;\n  for (int bit = 10; bit >= 0; bit--) {\n    uint8_t bus = 1;                         /* recessive idle level */\n    for (int i = 0; i < n; i++)\n      if (alive[i]) bus &= (id[i] >> bit) & 1u;   /* wired-AND */\n    for (int i = 0; i < n; i++)\n      if (alive[i] && ((id[i] >> bit) & 1u) != bus) alive[i] = 0; /* lost */\n  }\n  for (int i = 0; i < n; i++) if (alive[i]) return i;\n  return -1;\n}`,
   ce:'<code>bus &amp;=</code> models the wired-AND. A node whose bit differs from the bus level has lost arbitration. Assumes unique IDs and n at most 16.',
   p:'Assigning IDs in a BMS/EV network: safety messages (fault, contactor) get the lowest IDs.',
   f:['Why must two nodes never send the same ID?','Why 120 ohm termination at both ends (about 60 ohm measured)?'],
   m:'Believing the highest ID wins, or that a collision destroys the frame.',
   hook:'On CAN, 0 shouts louder than 1.'})]},
 { id:'K', title:'Debugging and Product Scenarios', short:'Debug+BMS', icon:'🛠️', blurb:'HardFault triage, BMS ADC maths and SOC by coulomb counting', questions:[

   ce:'<code>volatile</code> stops the optimizer from dropping the locals so the debugger can see them. A small assembly stub (MCU/compiler specific) selects MSP or PSP and passes it as <code>frame</code>.',
   p:'Map the PC to a source line with the .map file or addr2line, then check which pointer was bad.',

  mkQ('K2','BMS: a 10S pack (max 42 V) feeds a 12-bit, 3.3 V ADC through a 130k/10k divider. What ADC code means 42 V?',{
   a:'The divider ratio is 10/(130+10) = 1/14, so 42 V becomes 3.0 V at the pin. Code = 3.0/3.3 x 4095, about 3723. To convert back: pack_mV = adc_mV x 14.',
   d:'Pick the divider so the maximum pack voltage stays below Vref with headroom, and remember the divider adds error from resistor tolerance and loads the source.',
   w:'Vpin = Vpack x R2/(R1+R2). ADC code = Vpin/Vref x (2^12 - 1) for a ratiometric 12-bit converter, where full scale is code 4095 (MCU-specific; some count 4096 steps).',
   code:`#include <stdint.h>\n/* 12-bit ADC, Vref 3300 mV, divider ratio 14:1 */\nuint32_t pack_mv(uint16_t raw) {\n  uint32_t pin_mv = ((uint32_t)raw * 3300u) / 4095u;\n  return pin_mv * 14u;                  /* undo the divider */\n}`,
   ce:'The cast to <code>uint32_t</code> prevents 16-bit overflow of <code>raw*3300</code> on small MCUs. Integer maths avoids floating point.',
   p:'Over-voltage cut-off thresholds in battery protection logic.',
   f:['How would 0.5% resistors change the accuracy?','Where does ADC reference drift show up?'],
   m:'Forgetting the divider (reading 3 V as 3 V pack) or using 16-bit arithmetic that overflows.',
   hook:'Pin volts x ratio = pack volts.'}),
  mkQ('K3','How do you estimate State of Charge with coulomb counting?',{
   a:'Integrate current over time: SOC = SOC0 - (Idischarge x time) / capacity. Correct drift using voltage/OCV at rest and a periodic full-charge reset.',
   d:'It is accurate short term but drifts because of current-sensor offset, gain error and capacity ageing.',
   w:'Each sample adds I x dt to a charge accumulator. Example: 50 Ah pack, 10 A for 30 min is 5 Ah, so SOC falls by 10 percentage points.',
   code:`#include <stdint.h>\n/* i_ma: +discharge / -charge, dt_ms: sample period */\nstatic int64_t used_mas;                 /* milliamp-milliseconds */\nvoid soc_update(int32_t i_ma, uint32_t dt_ms) { used_mas += (int64_t)i_ma * dt_ms; }\n/* cap_mah: usable capacity; result 0..100 */\nint32_t soc_pct(int32_t cap_mah) {\n  int64_t used_mah = used_mas / 3600000;   /* mA*ms -> mAh */\n  int64_t pct = 100 - (used_mah * 100) / cap_mah;\n  return pct < 0 ? 0 : pct > 100 ? 100 : (int32_t)pct;\n}`,
   ce:'1 mAh = 3,600,000 mA-ms. A 64-bit accumulator avoids overflow. Clamp the result because drift can push it out of range.',
   p:'Fuel gauge in an EV pack or power tool.',
   f:['Why does offset error accumulate?','How do you combine OCV and coulomb counting?'],

function labTwos(root) {
  let v = -5, n = 8; const out = h('div', {});
  const draw = () => { const m = 2 ** n, lo = -(m / 2), hi = m / 2 - 1; out.innerHTML = '';
    if (!Number.isFinite(v)) { out.append(h('div', { class: 'panel' }, 'Enter an integer.')); return; }
    if (v < lo || v > hi) { out.append(h('div', { class: 'panel' }, `${v} does not fit in int${n}_t (range ${lo} to ${hi}). It would overflow (signed overflow is undefined behaviour in C).`)); return; }
    const u = ((v % m) + m) % m, b = u.toString(2).padStart(n, '0');
    out.append(h('div', { class: 'bits' }, ...[...b].map((c, i) => h('span', { class: 'bit', style: 'display:inline-block;min-width:1.5em;text-align:center;font-family:var(--mono)' + (i === 0 ? ';color:var(--hot);font-weight:700' : '') }, c))),
      eqh(`Stored pattern: <b>${hex(u, n / 4)}</b> · as <code>uint${n}_t</code> = <b>${u}</b> · as <code>int${n}_t</code> = <b>${v}</b>`),
      eqh(`To negate by hand: invert all bits, add 1. The top bit is the sign (weight −${m / 2}).`)); };
  root.append(h('div', { class: 'ctl row' }, h('label', {}, 'Value ', num(v, -32768, 32767, x => { v = x; draw(); })), h('label', {}, 'Width ', sel([[8, '8-bit'], [16, '16-bit']], n, x => { n = +x; draw(); }))), out); draw();
}
function labCan(root) {
  let ids = [0x120, 0x0F0, 0x2A0]; const out = h('div', {});
  const draw = () => { out.innerHTML = ''; let alive = ids.map(() => true); const rows = ids.map(() => []);
    for (let b = 10; b >= 0; b--) { const bit = ids.map(i => (i >> b) & 1); const bus = alive.reduce((a, l, k) => l ? a & bit[k] : a, 1);
      ids.forEach((_, k) => { rows[k].push(alive[k] ? (bit[k] === bus ? bit[k] : bit[k] + '✗') : '·'); if (alive[k] && bit[k] !== bus) alive[k] = false; }); }
    const dup = new Set(ids).size !== ids.length;
    out.append(h('table', {}, h('tr', {}, h('th', {}, 'Node (ID)'), ...Array.from({ length: 11 }, (_, i) => h('th', {}, 10 - i))),
      ...ids.map((id, k) => h('tr', {}, h('td', {}, `N${k + 1} ${hex(id, 3)}` + (alive[k] ? ' 🏆' : '')), ...rows[k].map(c => h('td', {}, String(c)))))),
      eqh(dup ? '⚠️ Two nodes share an ID. Real CAN forbids this: both would keep transmitting into a data-field collision.' : `Winner: <b>N${alive.indexOf(true) + 1}</b>. ✗ = sent recessive 1 but saw dominant 0, so it backs off. “·” = already stopped.`)); };
  root.append(h('div', { class: 'ctl row' }, ...ids.map((id, k) => h('label', {}, `N${k + 1} ID `, num(id, 0, 2047, x => { ids[k] = x; draw(); })))), out, h('p', { class: 'muted small' }, 'Decimal 11-bit IDs, 0 to 2047. Bus level = AND of all active bits.')); draw();
}

{ id: 'M', title: 'ARM Cortex-M and STM32 Basics', short: 'Cortex-M, STM32', icon: '🔌', blurb: 'MCU vs MPU, reset sequence, NVIC, GPIO, RCC, HAL vs registers, ST-Link', questions: [
  mq('M1', 'What is ARM Cortex-M, and what is the difference between an MCU and an MPU?', { k: 'MCU = CPU + flash + RAM + peripherals on one chip.',
    a: 'Cortex-M is ARM\'s core family for microcontrollers. An MCU integrates CPU, flash, RAM and peripherals and runs bare-metal or an RTOS. An MPU needs external RAM and storage and usually runs Linux.',
    d: 'STM32 parts use Cortex-M0/M3/M4/M7. Cortex-M has a 32-bit registers file (R0-R12, SP, LR, PC) and two stack pointers: MSP (main, used by startup code and ISRs) and PSP (process, typically used by RTOS tasks).',
    f: ['What are MSP and PSP?', 'Why does an RTOS use PSP for tasks?'], m: 'Calling any 32-bit chip an MPU.' }),
  mq('M2', 'What happens when a Cortex-M MCU resets? What is the vector table?', { k: 'Load MSP, load PC, run Reset_Handler.', hot: true,
    a: 'The core reads the first word of the vector table into MSP, the second word into PC (Reset_Handler), then runs. Reset_Handler copies .data to RAM, zeroes .bss, calls SystemInit, then main().',
    d: 'The vector table is an array of addresses: initial stack pointer, then handlers for Reset, NMI, HardFault, SysTick and every peripheral interrupt. The NVIC uses it to jump to the right ISR. SysTick is a 24-bit core timer, commonly set for a 1 ms tick.',
    f: ['What happens if the stack pointer value is invalid?', 'What is NVIC?'], m: 'Saying main() is the first code that runs.' }),
  mq('M3', 'What is GPIO, and why must RCC be configured first? HAL vs register-level?', { k: 'No clock, no peripheral.', lab: 'gpio',
    a: 'GPIO pins are software-controlled digital inputs or outputs. On STM32 every peripheral is clock-gated by RCC, so you enable its clock first or register writes do nothing. HAL is ST\'s readable library; register-level code is faster, smaller and shows what the hardware does.',
    d: 'Each pin has mode bits (input, output, alternate function, analog), output type, speed and pull-up/down. ST-Link on a Nucleo board is the on-board debugger/programmer that talks SWD (two wires: SWDIO, SWCLK).',
    c: 'RCC->AHB1ENR |= RCC_AHB1ENR_GPIOAEN;   /* clock on */\nGPIOA->MODER  &= ~(3u << (5u * 2u));    /* clear PA5 mode */\nGPIOA->MODER  |=  (1u << (5u * 2u));    /* PA5 output */\nGPIOA->ODR    ^=  (1u << 5u);           /* toggle LED */\n/* HAL: HAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5); */', t: 'STM32F4-style. ' + HW,

    d: 'Without volatile the optimizer may cache a status flag in a CPU register and spin forever, or drop a write it thinks is useless.',
    c: '#include <stdint.h>\n#define REG32(a) (*(volatile uint32_t *)(a))\n#define GPIOA_ODR REG32(0x40020014u)   /* STM32F4 */\nGPIOA_ODR |= (1u << 5);\nwhile (!(REG32(0x40011000u) & (1u << 7))) { }   /* wait for flag */', t: 'Address is device specific. ' + HW,

function labGpio(root) {
  let n = 5, m = 1; const out = h('div', {});
  const names = ['Input', 'Output', 'Alternate function', 'Analog'];
  const draw = () => { const v = ((m << (n * 2)) >>> 0), b = v.toString(2).padStart(32, '0'); let s = '';
    for (let i = 0; i < 32; i++) { const bit = 31 - i, inF = bit === n * 2 || bit === n * 2 + 1; s += (inF ? '<b style="color:var(--accent,#4f8cff)">' + b[i] + '</b>' : b[i]) + (bit % 4 === 0 && bit ? ' ' : ''); }
    out.innerHTML = `<p>PA${n}: <b>${names[m]}</b> (field value ${m.toString(2).padStart(2, '0')})</p><p><code>MODER = 0x${v.toString(16).toUpperCase().padStart(8, '0')}</code> (all other pins at reset value 00)</p><p><code>${s}</code></p><p><code>GPIOA-&gt;MODER = (GPIOA-&gt;MODER &amp; ~(3u &lt;&lt; ${n * 2})) | (${m}u &lt;&lt; ${n * 2});</code></p><p class="muted small">Each pin uses two bits, so pin n sits at bits 2n+1:2n. Enable the GPIOA clock in RCC first.</p>`; };
  const pin = h('input', { type: 'number', min: 0, max: 15, value: n, 'aria-label': 'Pin number', oninput: e => { n = Math.max(0, Math.min(15, +e.target.value | 0)); draw(); } });
  const mode = h('select', { 'aria-label': 'Pin mode', onchange: e => { m = +e.target.value; draw(); } }, ...names.map((x, i) => h('option', { value: i, selected: i === m }, x)));
  root.append(h('div', { class: 'row', style: 'gap:10px;flex-wrap:wrap;margin:8px 0' }, h('label', {}, 'Pin ', pin), h('label', {}, 'Mode ', mode)), out); draw();
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');

}

/* ---------- tiny C highlighter ---------- */
const KW = 'if|else|for|while|do|switch|case|default|break|continue|return|goto|sizeof|typedef|struct|union|enum|static|extern|const|volatile|register|inline|void|int|char|short|long|unsigned|signed|float|double|bool|true|false|NULL|uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t|size_t|node|state_t|cb_t';
const HL = new RegExp('(\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')|(^[ \\t]*#\\w+.*$)|(\\b(?:0x[0-9a-fA-F]+|\\d+)[UuLl]*\\b)|(\\b(?:' + KW + ')\\b)', 'gm');
function highlight(root) {
  $$('pre.c code, pre.C code', root).forEach(c => {

  });
}

/* ---------- router ---------- */
let cleanup = null;
function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  $('#side').classList.remove('open');
  const [, view, arg] = location.hash.split('/');
  const V = $('#view'); V.innerHTML = '';
  searchBox.value = '';
  buildNav();
  if (view === 'learn') viewLearn(arg);
  else if (view === 'q') { const q = qById(arg); if (q) viewLearn(q.part, q.id); else viewHome(); }
  else if (view === 'flash') viewFlash();
  else if (view === 'quiz') viewQuiz();
  else if (view === 'mock') viewMock();
  else if (view === 'labs') viewLabs(arg || 'bits');

        h('div', { class: 'bar', style: 'margin:8px 0 16px' }, h('i', { style: `width:${i * 100 / list.length}%` })), h('h2', { html: inline(q.q) }));

/* ---------- mock interview ---------- */
const FOLLOW = ['Can you give a small code example?', 'What goes wrong if you get this wrong?', 'How would you explain that to a junior engineer?', 'Have you seen this in your own project?', 'Is there a trade-off here?', 'How would you test or debug that?'];
function viewMock() {
  const V = $('#view'); let pool = 'rapid', n = 10, secs = 90;
  V.append(h('h1', {}, '🎤 Mock interview'), h('p', { class: 'muted' }, 'Answer out loud first, like a real interviewer is listening. Then reveal the model answer and grade yourself honestly.'));
  const box = h('div', { class: 'panel' }); V.append(box);
  let timer = null; cleanup = () => clearInterval(timer);
  const setup = () => {
    box.innerHTML = '';
    const mk = (label, items, cur, set) => h('div', {}, h('div', { class: 'small muted' }, label), h('div', { class: 'chips' }, items.map(([k, l]) => h('button', { class: 'chip' + (cur === k ? ' on' : ''), onclick: () => { set(k); setup(); } }, l))));
    box.append(mk('Question set', [['rapid', '⚡ Rapid-fire (short answers)'], ['hot', '🔥 Top asked (deep)'], ['all', 'Everything (deep)'], ...DATA.parts.filter(p => 'ABCDEF'.includes(p.id)).map(p => [p.id, p.icon + ' ' + p.id])], pool, k => pool = k),
      mk('How many', [[5, '5'], [10, '10'], [15, '15']], n, k => n = k),
      mk('Time per answer', [[60, '60 s'], [90, '90 s'], [120, '2 min'], [0, 'No timer']], secs, k => secs = k),
      h('button', { class: 'btn primary', onclick: begin }, 'Start the interview'));
  };
  function begin() {
    let items;
    if (pool === 'rapid') items = shuffle(DATA.rapid).slice(0, n).map(r => ({ title: r.q, html: '<p>' + r.a + '</p>', rapid: true }));
    else items = shuffle(ALLQ.filter(q => (pool === 'all' || (pool === 'hot' && q.hot) || q.part === pool) && !q.title.startsWith('The four') && q.part !== 'G' && q.part !== 'H')).slice(0, n).map(q => ({ title: q.title, html: q.html, hook: q.hook, id: q.id }));
    let i = 0, nailed = 0, almost = 0; const missed = [];
    const ask = () => {
      clearInterval(timer); box.innerHTML = '';
      if (i >= items.length) return finish();
      const it = items[i]; let left = secs;
      const bar = h('i', {}); const tl = h('span', { class: 'mono' }, secs ? left + 's' : '');
      box.append(h('div', { class: 'row', style: 'justify-content:space-between' }, h('span', { class: 'muted' }, `Question ${i + 1} of ${items.length}`), tl),
        secs ? h('div', { class: 'timer' }, bar) : h('div', { style: 'height:10px' }),
        h('div', { class: 'interviewer' }, h('div', { class: 'avatar' }, '🧑‍💼'), h('div', { class: 'bubble', html: it.rapid ? it.title : inline(it.title) })));
      const ta = h('textarea', { class: 'say', placeholder: 'Say it out loud, then jot your key points here (optional). Use the formula: definition → why → tiny example.' });
      const reveal = h('div', {}); box.append(h('div', { style: 'margin-top:14px' }, ta), reveal);
      const btn = h('button', { class: 'btn primary', style: 'margin-top:10px', onclick: showAns }, 'Reveal model answer'); reveal.append(btn);
      if (secs) timer = setInterval(() => { left--; tl.textContent = Math.max(left, 0) + 's'; bar.style.width = Math.max(left, 0) * 100 / secs + '%'; if (left <= 0) { clearInterval(timer); tl.textContent = 'Time’s up'; } }, 1000);
      requestAnimationFrame(() => bar.style.width = '100%');
      function showAns() {
        clearInterval(timer); reveal.innerHTML = '';
        const ans = h('div', { class: 'explain' }); ans.innerHTML = it.html; if (it.hook) ans.prepend(h('div', { class: 'hook' }, '💡 ', it.hook)); highlight(ans);
        const g = (label, cls, fn) => h('button', { class: 'btn ' + cls, onclick: () => { fn(); i++; store.mock.total++; save(); ask(); } }, label);
        reveal.append(ans, h('div', { class: 'callout', style: 'margin-top:10px' }, '🧑‍💼 Follow-up: ' + FOLLOW[Math.floor(Math.random() * FOLLOW.length)]),
          h('div', { class: 'small muted', style: 'margin:10px 0 6px' }, 'Be honest. How did your answer compare?'),
          h('div', { class: 'row' }, g('✅ Nailed it', 'ok', () => { nailed++; store.mock.nailed++; }), g('🤏 Almost', '', () => { almost++; }), g('❌ Missed it', 'bad', () => { missed.push(it); if (it.id) store.star[it.id] = true; })));

        h('div', { class: 'muted' }, `${nailed} nailed · ${almost} almost · ${missed.length} missed`)),
        missed.length ? h('div', {}, h('b', {}, 'Missed (deep ones are starred for review):'), h('ul', {}, missed.map(m => h('li', { html: m.rapid ? m.title : inline(m.title) })))) : null,
        h('div', { class: 'row', style: 'margin-top:14px' }, h('button', { class: 'btn primary', onclick: begin }, 'Another round'), h('button', { class: 'btn', onclick: setup }, 'Change settings')));
    };

  }

}

/* ===== Enhanced extension: views (Coding Practice Lab, Roadmap, extra labs) ===== */
store.code = store.code || {}; store.road = store.road || {}; store.daily = store.daily || {}; store.ver = 2; save();
const HARN = '#include <stdio.h>\nstatic int fails;\n#define T(c) do{ if(!(c)){ printf("FAIL line %d: %s\\n",__LINE__,#c); fails++; } }while(0)\n';
const fullC = (ex, code) => HARN + code + '\n' + ex.main.replace('return fails;', 'printf(fails?"FAILED: %d\\n":"ALL TESTS PASSED\\n",fails); return fails;') + '\n';
function viewCode(id) {
  const V = $('#view'); const ex = EXS.find(e => e.id === id) || EXS[0];
  const rec = store.code[ex.id] = store.code[ex.id] || {};

    h('div', { class: 'callout' }, h('b', {}, 'Honest note: '), 'this page does not compile or run your C. “Self-check” only looks for the key constructs. To really run it, press “Copy runnable test file”, paste into a file and build with ',
      h('code', {}, 'gcc -std=c11 -Wall -Wextra test.c && ./a.out'), ' (or an online compiler).'));

  const out = h('div', { class: 'panel', 'aria-live': 'polite', style: 'margin-top:10px' }, 'Press “Self-check” for feedback.');
  const sol = h('div', {}); let hi = 0;
  const btn = (l, f, c) => h('button', { class: 'btn sm ' + (c || ''), onclick: f }, l);
  const copy = txt => (navigator.clipboard ? navigator.clipboard.writeText(txt).then(() => toast('Copied. Build it with gcc.'), () => toast('Copy failed. Select the code manually.')) : toast('Clipboard not available here.'));

    btn('Reset code', () => { delete rec.draft; save(); ta.value = ex.starter; out.textContent = 'Code reset.'; }),
    btn('Reveal solution', () => { sol.innerHTML = ''; sol.append(h('div', { class: 'panel' }, h('h3', {}, 'Expected solution'), h('pre', {}, h('code', {}, ex.sol)), h('p', { html: ex.why }), h('p', { html: '<b>Common mistake:</b> ' + ex.mistake }), h('p', { html: '<b>Follow-up:</b> ' + esc(ex.follow) }))); highlight(sol); }),
    btn(rec.done ? '✅ Done' : 'Mark done', () => { rec.done = !rec.done; save(); route(); }));
